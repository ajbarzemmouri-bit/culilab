<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CuliLab • Elementenlab v13.6</title>
<style>
*{box-sizing:border-box}
:root{--cream:#f7f0e3;--dark:#20150e;--gold:#f5a019;--orange:#ed7410;--green:#e7f6e6;--red:#fde5df;--ink:#29231e}
body{margin:0;background:#17110d;font-family:Arial,sans-serif;color:var(--ink)}
.app{max-width:430px;margin:auto;min-height:100vh;background:var(--cream);overflow:hidden}
header{padding:17px 17px 13px;color:#fff;background:linear-gradient(135deg,#21160f,#54351f)}
.brand{font-size:27px;font-weight:900}.tag{font-size:11px;letter-spacing:1.2px;opacity:.75;margin-top:2px}
.stats{display:flex;gap:7px;margin-top:12px}.pill{font-size:13px;font-weight:800;background:#ffffff14;border:1px solid #ffffff22;padding:7px 9px;border-radius:16px}
.progress{height:7px;background:#ffffff20;border-radius:8px;margin-top:11px;overflow:hidden}.progress i{display:block;height:100%;width:12%;background:#ffc94f;transition:.3s}
.mode{margin:13px 14px 9px;padding:13px;border-radius:18px;background:#fff0b8;text-align:center}
.mode b{display:block;font-size:12px;letter-spacing:1px;color:#90651e}.mode h2{margin:5px 0 3px;font-size:21px}.mode p{margin:0;font-size:13px;line-height:1.35}
.stage{position:relative}.stage img{width:100%;display:block}
.sauce{position:absolute;left:35%;top:48%;width:31%;height:18%;border-radius:50%;background:#d7ab58;opacity:.93;transition:.35s;box-shadow:inset 0 5px 12px #fff7}
.sauce.milk{background:#fff0c9}.sauce.good{background:#fff5d9}.sauce.burnt{background:#59301e}.sauce.lumpy{background:radial-gradient(circle,#fff8dc 0 8%,#d3bd82 9% 17%,#f3e3b9 18% 100%)}.sauce.thin{background:#f8f0d7;opacity:.7}
.flame{position:absolute;left:46%;bottom:4%;font-size:34px;opacity:0}.flame.on{opacity:1}
.tip{position:absolute;left:12px;right:12px;bottom:10px;background:#21170fe8;color:#fff;padding:10px 12px;border-radius:14px;font-size:13px;line-height:1.3;box-shadow:0 5px 15px #0005}
.tip:after{content:"";position:absolute;bottom:-8px;left:24%;border:8px solid transparent;border-top-color:#21170fe8;border-bottom:0}
.panel{padding:12px 15px 24px}.goal{text-align:center;font-size:19px;font-weight:900;margin:5px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.group{background:#fff;border-radius:16px;padding:11px;margin-bottom:9px;box-shadow:0 3px 10px #0001}
.group h3{font-size:12px;text-transform:uppercase;letter-spacing:.8px;margin:0 0 8px;color:#8b765e}
button{width:100%;border:2px solid #e0d3c1;background:#fff;border-radius:13px;padding:11px 7px;font-size:14px;font-weight:800;color:#60411d;margin:3px 0;box-shadow:0 2px 0 #d4c2ac}
button.selected{background:#ffe49a;border-color:#3a2b20}button.primary{background:linear-gradient(135deg,#f5a019,#ed7410);border:0;color:#fff;font-size:16px;box-shadow:0 4px 0 #a64d08;padding:13px}
.feedback{padding:12px;border-radius:14px;text-align:center;background:#efebe5;line-height:1.35;margin-top:9px}.success{background:var(--green)}.error{background:var(--red)}
.hidden{display:none!important}.stars{font-size:29px;letter-spacing:4px}.result{text-align:center;background:#fff0b8;border-radius:18px;padding:15px;margin-top:10px}
.small{font-size:12px;color:#786b5d}.attempt{font-size:12px;font-weight:900;text-align:center;color:#9b650f;margin:7px}
.choiceHint{animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.03);box-shadow:0 0 0 4px #ffc94f55}}

.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:9px 12px;background:#2a1b12;position:sticky;top:0;z-index:20}
.nav button{margin:0;padding:9px 3px;background:#ffffff12;border:1px solid #ffffff25;box-shadow:none;color:#fff;font-size:12px}
.nav button.active{background:#f5a019;border-color:#f5a019}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}

.homecards{display:grid;gap:10px;margin-top:12px;text-align:left}
.homecard{border:1px solid #ead8bd;background:#fff;border-radius:17px;padding:14px;box-shadow:0 3px 10px #0001}
.homecard b{display:block;font-size:17px;margin-bottom:4px;color:#382719}
.homecard span{font-size:13px;line-height:1.35;color:#756454}
.homecard button{margin-top:10px}
.badge{display:inline-block;background:#fff0b8;border-radius:12px;padding:5px 8px;font-size:11px;font-weight:900;margin-top:5px}

.toolgame{background:#fff;border-radius:18px;padding:14px;margin-top:10px;box-shadow:0 3px 10px #0001}
.toolrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}
.toolchoice{min-height:105px;font-size:42px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.toolchoice span{font-size:13px;margin-top:6px}
.lesson{font-size:13px;line-height:1.4;background:#fff7dd;border-radius:13px;padding:10px;margin:9px 0}

/* v12 clean-build additions */
#v12app{max-width:520px;margin:0 auto;background:#fbf4e7;min-height:100vh}
.v12head{background:linear-gradient(135deg,#3a2116,#6b3b1f);color:#fff;padding:20px 18px 14px}
.v12brand{font-size:29px;font-weight:800}.v12sub{font-size:11px;letter-spacing:1.4px;opacity:.8}
.stats{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.pill{background:#ffffff18;border:1px solid #ffffff20;border-radius:13px;padding:9px 12px;font-weight:700}
.bar{height:7px;background:#ffffff25;border-radius:8px;margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;background:#ffc43d;width:25%}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:#2a1b14;padding:10px 12px;position:sticky;top:0;z-index:10}
.nav button,.choice,.primary,.card button{border:0;border-radius:13px;padding:13px;font-weight:800;cursor:pointer}
.nav button{background:#3a2921;color:#fff;border:1px solid #ffffff20}.nav button.active{background:#ff9d12}
main{padding:14px}.hero{background:#ffefad;border-radius:17px;padding:16px;text-align:center;margin-bottom:12px}.hero small{font-weight:800;letter-spacing:1px;color:#8c5b16}.hero h2{margin:6px 0}
.pan{width:100%;display:block;border-radius:15px;margin:10px 0 16px}
.card{background:#fff;border-radius:17px;padding:15px;margin:11px 0;box-shadow:0 2px 8px #00000010}
.card h3{margin:0 0 8px}.card p{margin:6px 0 12px;color:#6b584b}
.card button{width:100%;background:#fff;border:2px solid #dfcfbb;color:#5a381d}
.group{background:#fff;border-radius:17px;padding:13px;margin:10px 0}.label{font-size:12px;font-weight:800;letter-spacing:1px;color:#8b735f;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{background:#fff;border:2px solid #dfcfbb;color:#53391f;min-height:50px}.choice.selected{background:#ffe39a;border-color:#3e2b20}
.toolChoice{min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:.18s}
.toolChoice img{width:115px;height:115px;object-fit:contain}
.toolChoice.chosen{background:#ffe39a;border-color:#3e2b20;transform:scale(.98)}
.toolChoice.correct{background:#dff4e3;border-color:#4d9a5b}
.toolChoice.wrong,.choice.wrong{background:#ffe1dc;border-color:#c85a49}
.toolChoice.correct,.choice.correct{background:#dff4e3;border-color:#4d9a5b}
.cookstage{position:relative;margin:10px 0 16px;border-radius:15px;overflow:hidden}
.cookstage .pan{margin:0}
.panSauce{position:absolute;left:35%;top:48%;width:31%;height:18%;border-radius:50%;background:transparent;opacity:0;transition:.3s;box-shadow:inset 0 5px 12px #fff8}
.panSauce.show{opacity:.92}
.panSauce.milk{background:#fff0c9}
.panSauce.warming{background:#f1d99d}
.panSauce.good{background:#fff4d4}
.panSauce.lumpy{background:radial-gradient(circle at 35% 35%,#fff9e8 0 7%,#cdb77d 8% 14%,#efe0b7 15% 100%)}
.panSauce.burnt{background:#5b321f}
.panSauce.thin{background:#f8f0d7;opacity:.72}
.panSauce.thick{background:radial-gradient(ellipse at 50% 45%,#efd995 0 42%,#d0a94d 70%,#a77b2d 100%);transform:scale(.84,.68);box-shadow:inset 0 9px 16px #fff7,0 5px 0 #9a702a99,0 0 0 4px #c99c3f99}
.panSauce.thick:after{content:"";position:absolute;left:7%;right:7%;bottom:-18%;height:42%;border-radius:50%;background:#c89d45;opacity:.8;filter:blur(1px)}
.panSauce.scorch{background:radial-gradient(ellipse at 50% 78%,#4a2418 0 18%,#7c3e22 19% 29%,#bb7540 30% 39%,#e1c47f 40% 100%);box-shadow:inset 0 -8px 13px #5b2b1faa,0 0 14px #ff9d3b99;animation:heatPulse .85s ease-in-out infinite alternate}
.panSauce.scorch:after{content:"♨";position:absolute;left:50%;top:-48%;transform:translateX(-50%);font-size:25px;color:#7b321e;text-shadow:0 -8px 0 #b85c2c88,0 -16px 0 #e38b3c55;animation:steamRise 1.1s ease-in-out infinite}
.panSauce.rescued{animation:rescuePop .55s ease-out}
@keyframes heatPulse{from{filter:saturate(1)}to{filter:saturate(1.35) brightness(.92)}}
@keyframes steamRise{from{opacity:.45;transform:translate(-50%,5px)}to{opacity:1;transform:translate(-50%,-5px)}}
@keyframes rescuePop{0%{transform:scale(.86);filter:brightness(1.25)}100%{transform:scale(1);filter:brightness(1)}}
.panSauce.rescued{background:#fff4d4;box-shadow:inset 0 5px 12px #fff8,0 0 14px #ffe29a}
.panSauce.lumpy:after{content:"";position:absolute;inset:18% 15%;border-radius:50%;background:radial-gradient(circle at 20% 35%,#fff 0 4%,transparent 5%),radial-gradient(circle at 55% 25%,#fff 0 5%,transparent 6%),radial-gradient(circle at 70% 60%,#fff 0 4%,transparent 5%),radial-gradient(circle at 35% 70%,#fff 0 5%,transparent 6%)}
.panStatus{position:absolute;left:10px;right:10px;bottom:10px;background:#21170fe8;color:#fff;padding:9px 11px;border-radius:13px;text-align:center;font-size:13px}

.primary{width:100%;background:#ff8e0a;color:#fff;font-size:17px;margin-top:12px;box-shadow:0 4px 0 #b85c00}
.feedback{padding:13px;border-radius:14px;margin-top:12px;text-align:center;background:#f0ede7}.good{background:#e2f5e5}.bad{background:#ffe5df}
.result{background:#ffefad;border-radius:17px;padding:18px;text-align:center;margin-top:12px}.stars{font-size:30px}
.hidden{display:none!important}.muted{color:#765f4e;font-size:13px}.center{text-align:center}

.labgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.element{background:#fff;border:2px solid #e2d2bd;border-radius:16px;padding:14px 8px;text-align:center;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800}.element .emoji{font-size:38px;margin-bottom:6px}.element.selected{background:#ffe39a;border-color:#ff9d12;transform:scale(.98)}.element.locked{opacity:.42;filter:grayscale(1)}.labbench{background:#2f2119;color:#fff;border-radius:18px;padding:16px;text-align:center;margin:12px 0}.slots{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:12px 0}.slot{background:#fff2;border:2px dashed #ffffff66;border-radius:14px;min-height:82px;display:flex;align-items:center;justify-content:center;padding:8px;font-weight:800}.discovery{background:#e2f5e5;border:2px solid #70aa79;border-radius:17px;padding:16px;text-align:center;margin-top:12px}.newbadge{display:inline-block;background:#ff9d12;color:#fff;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:900}.collection{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:9px}.chip{background:#fff;border:1px solid #e0cfb8;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}.dish{min-height:112px}.dish .emoji{font-size:38px}.applyIntro{background:#fff4d7;border:2px solid #f1bf5c;border-radius:16px;padding:13px;text-align:center;margin:12px 0}
</style>
</head>
<body>
<div id="v12app">
  <header class="v12head">
    <div class="v12brand">🧪 CuliLab</div>
    <div class="v12sub">CHEF ACADEMY • LEER → ONTDEK → BEHEERS</div>
    <div class="stats">
      <span class="pill">👨‍🍳 Lv. <b id="level">2</b></span>
      <span class="pill">⭐ <b id="xp">0</b> XP</span>
      <span class="pill">🪙 <b id="coins">0</b></span>
      <span class="pill">🏅 <b id="medals">0</b></span>
    </div>
    <div class="bar"><i id="progress"></i></div>
  </header>

  <nav class="nav">
    <button id="navHome" type="button">🏠 Start</button>
    <button id="navTraining" type="button">🎓 Training</button>
    <button id="navChallenge" type="button">🔥 Challenges</button>
    <button id="navLab" type="button">🧪 Lab</button>
  </nav>
  <main id="screen"></main>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
function shuffled(arr){ return [...arr].sort(()=>Math.random()-0.5); }
const state = {
  xp:0, coins:0, medals:0,
  tutorialDone:false, toolsDone:false, freeDone:false, rescueDone:false,
  tutorialStep:0, toolQ:0, toolMistakes:0, rescueQ:0, rescueMistakes:0,
  picks:{ingredient:null,temp:null,tech:null},
  discovered:["bechamel"], labPick:null, mornayDone:false, soubiseDone:false, mustardDone:false, applyDone:false, bechamelApply:[], tasteFound:{}
};
const pan = "culilab-pan.png";
const garde = "culilab-garde.png?v=1200";
const spatel = "culilab-spatel.png?v=1200";

function stats(){
  $("xp").textContent=state.xp; $("coins").textContent=state.coins; $("medals").textContent=state.medals;
  const done=[state.tutorialDone,state.toolsDone,state.freeDone,state.rescueDone].filter(Boolean).length;
  $("progress").style.width=(10+done*22.5)+"%";
}
function active(id){
  ["navHome","navTraining","navChallenge","navLab"].forEach(x=>$(x).classList.toggle("active",x===id));
}
function reward(key,xp,coins,medal=0){
  const k="_reward_"+key;
  if(state[k]) return false;
  state[k]=true; state.xp+=xp; state.coins+=coins; state.medals+=medal; stats(); return true;
}
function img(){return `<img class="pan" src="${pan}" alt="Pan">`;}
function visualPan(kind="",status=""){
 return `<div class="cookstage"><img class="pan" src="${pan}" alt="Pan"><div id="panSauce" class="panSauce ${kind?"show "+kind:""}"></div>${status?`<div id="panStatus" class="panStatus">${status}</div>`:""}</div>`;
}
function rescueVisual(i){
 const visuals=[
  ["lumpy","⚪ Kijk goed: de saus heeft zichtbare klontjes."],
  ["thick","🥣 De saus is zwaar en veel te dik geworden."],
  ["scorch","🔥 Let op: de saus begint onderin donker aan te zetten."]
 ];
 return visualPan(...visuals[i]);
}
function toolVisual(i){
 const visuals=[
  ["lumpy","⚪ Kleine klontjes zijn zichtbaar in de béchamel."],
  ["thick","🥣 Dikke saus blijft aan bodem en randen hangen."],
  ["milk","🥛 Melk en roux moeten nog glad worden gemengd."]
 ];
 return visualPan(...visuals[i]);
}
function rescueRecovered(text){
 const sauce=$("panSauce"), status=$("panStatus");
 if(sauce){sauce.className="panSauce show rescued";}
 if(status){status.textContent="✨ "+text;}
}
function cookingPan(){
 return `<div class="cookstage"><img class="pan" src="${pan}" alt="Pan waarin de saus wordt bereid"><div id="panSauce" class="panSauce"></div><div id="panStatus" class="panStatus">De pan is klaar. Maak je keuzes.</div></div>`;
}
function updatePan(){
 const s=$("panSauce"), t=$("panStatus");
 if(!s||!t) return;
 s.className="panSauce";
 const p=state.picks;
 if(!p.ingredient&&!p.temp&&!p.tech){t.textContent="De pan is klaar. Maak je keuzes.";return;}
 if(p.ingredient==="milk"){s.classList.add("show","milk");t.textContent="🥛 Melk toegevoegd — de vloeistof zit nu in de pan.";}
 else if(p.ingredient==="stock"){s.classList.add("show","thin");t.textContent="🍲 Bouillon toegevoegd.";}
 if(p.temp==="mid"){s.classList.add("show","warming");t.textContent="🔥 Middel vuur — de saus warmt gecontroleerd op.";}
 if(p.temp==="high"){s.classList.add("show","burnt");t.textContent="🔥 Hoog vuur — pas op, de saus kan aanzetten.";}
 if(p.temp==="low"){t.textContent="🔥 Laag vuur — de saus warmt langzaam op.";}
 if(p.tech==="whisk"){t.textContent="🥄 Je klopt met de garde — het mengsel wordt gladder.";}
 if(p.tech==="none"){s.classList.add("show","lumpy");t.textContent="✋ Niet mengen — er ontstaan klontjes.";}
}
function showPanResult(kind,text){
 const s=$("panSauce"), t=$("panStatus");
 if(!s||!t) return;
 s.className="panSauce show "+kind;
 t.textContent=text;
}
function setScreen(html){$("screen").innerHTML=html; window.scrollTo({top:0,behavior:"auto"});}
function home(){
  active("navHome"); stats();
  setScreen(`${img()}
  <div class="center"><h2>👨‍🍳 Chef Dashboard</h2><p class="muted">Train, herken je gereedschap, kook zelfstandig en red de service.</p></div>
  <div class="card"><h3>🎓 1. Béchamel training</h3><p>De chef helpt je één keer stap voor stap.</p><button id="goTrain" type="button">${state.tutorialDone?"Opnieuw trainen":"Start training"}</button></div>
  <div class="card"><h3>🥄 2. Keukentools</h3><p>Herken garde en spatel en kies wat je in de situatie nodig hebt.</p><button id="goTools" type="button">Garde of spatel?</button></div>
  <div class="card"><h3>👨‍🍳 3. Zelfstandig koken</h3><p>Geen aanwijzingen. Pas toe wat je hebt geleerd.</p><button id="goFree" type="button">Speel zelfstandig</button></div>
  <div class="card"><h3>🔥 4. Rescue Challenge</h3><p>Herken fouten en red drie sauzen tijdens de service.</p><button id="goRescue" type="button">Start Rescue</button></div>
  <div class="card"><h3>🧪 5. Elementenlab</h3><p>${state.freeDone?"Combineer je beheerst element met nieuwe ingrediënten en ontdek nieuwe sauzen.":"Beheers eerst de béchamel om het Elementenlab te openen."}</p><button id="goLab" type="button">${state.freeDone?"Open Elementenlab":"🔒 Nog vergrendeld"}</button></div>`);
  $("goTrain").addEventListener("click", startTutorial);
  $("goTools").addEventListener("click", startTools);
  $("goFree").addEventListener("click", startFree);
  $("goRescue").addEventListener("click", startRescue);
  $("goLab").addEventListener("click",()=>state.freeDone?startLab():startFree());
}
function startTutorial(){
  active("navTraining"); state.tutorialStep=0; state.picks={ingredient:null,temp:null,tech:null}; renderTutorial();
}
function renderTutorial(){
  const steps=[
    {title:"Stap 1 van 3 • VLOEISTOF",msg:"🥛 <b>Melk = vloeistof.</b><br>De melk maakt van de roux een saus. Voeg de vloeistof toe en meng goed.",group:"ingredient"},
    {title:"Stap 2 van 3 • WARMTE",msg:"🔥 <b>Middel = gecontroleerde warmte.</b><br>De saus heeft warmte nodig om te binden. Te hoog vuur vergroot de kans op aanzetten.",group:"temp"},
    {title:"Stap 3 van 3 • BEWEGING",msg:"🥄 <b>Garde = beweging.</b><br>Door te kloppen meng je melk en roux gelijkmatig en help je klontjes voorkomen.",group:"tech"}
  ];
  const d=steps[Math.min(state.tutorialStep,2)];
  setScreen(`<div class="hero"><small>RONDE 1 • CHEF-TUTORIAL</small><h2>Béchamel leren</h2><div>De chef helpt je één keer. Daarna sta je er zelf voor.</div></div>
  ${cookingPan()}<div class="feedback">${d.msg}</div><h2 class="center">Maak een gladde béchamel</h2><p class="center muted">Tutorial • ${d.title}</p>
  ${cookGroups(true)}<button id="prepare" class="primary" type="button">🔍 Bereid saus</button><div id="out"></div>`);
  wireCook(true);
}
function cookGroups(tutorial){
 const ing=shuffled([["milk","🥛 Melk"],["stock","🍲 Bouillon"]]);
 const temps=shuffled([["low","🔥 Laag"],["mid","🔥🔥 Middel"],["high","🔥🔥🔥 Hoog"]]);
 const tech=shuffled([["whisk","🥄 Kloppen"],["none","✋ Niet mengen"]]);
 const buttons=(kind,items)=>items.map(([v,label])=>`<button class="choice" data-kind="${kind}" data-val="${v}" type="button">${label}</button>`).join("");
 return `<div class="group"><div class="label">INGREDIËNT</div><div class="grid2">${buttons("ingredient",ing)}</div></div>
 <div class="group"><div class="label">TEMPERATUUR</div><div class="grid2">${buttons("temp",temps)}</div></div>
 <div class="group"><div class="label">TECHNIEK</div><div class="grid2">${buttons("tech",tech)}</div></div>`;
}
function wireCook(tutorial){
  document.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>{
    const kind=b.dataset.kind,val=b.dataset.val;
    if(tutorial){
      const expected=[["ingredient","milk"],["temp","mid"],["tech","whisk"]][state.tutorialStep];
      if(kind!==expected[0] || val!==expected[1]) return;
      state.picks[kind]=val; document.querySelectorAll(`[data-kind="${kind}"]`).forEach(x=>x.classList.remove("selected")); b.classList.add("selected");
      updatePan(); if(state.tutorialStep<2){state.tutorialStep++; setTimeout(renderTutorial,420);}
    } else {
      state.picks[kind]=val; document.querySelectorAll(`[data-kind="${kind}"]`).forEach(x=>x.classList.remove("selected")); b.classList.add("selected"); updatePan();
    }
  }));
  $("prepare").addEventListener("click",()=> tutorial ? finishTutorial() : checkFree());
}
function finishTutorial(){
  if(!(state.picks.ingredient==="milk"&&state.picks.temp==="mid"&&state.picks.tech==="whisk")){
    $("out").innerHTML=`<div class="feedback">Volg eerst de drie aanwijzingen van de chef.</div>`; return;
  }
  state.tutorialDone=true; const got=reward("tutorial",50,10); stats();

   $("applyAgain").addEventListener("click",startBechamelApply); return;
 }
 const f={fruit:"🍓 Béchamel is een hartige saus op basis van roux en melk. Deze zoete toepassing past niet bij wat je hier hebt geleerd.",steak:"🥩 Bij een gegrilde steak kies je doorgaans een andere saus of bereiding. Béchamel is hier niet de logische klassieke toepassing."};
 $("applyOut").innerHTML=`<div class="feedback bad">${f[v]}<br><br><b>Geen strafpunten — toepassen is ook ontdekken.</b></div>`;
}

function startSoubiseApply(){
 active("navLab");
 const dishes=shuffled([
  ["lamb","🍖","Lamskotelet"],
  ["salmon","🐟","Gebakken zalm"],
  ["pasta","🍝","Pasta met tomatensaus"],
  ["fruit","🍓","Fruitsalade"]
 ]);
 setScreen(`<div class="hero"><small>CULILAB • TOEPASSEN</small><h2>🍽️ Waar past Soubise bij?</h2><div>Je hebt de saus ontdekt. Nu ontdek je hoe je haar in een gerecht kunt gebruiken.</div></div>
 <div class="applyIntro"><b>🧅 Soubisesaus</b><br><span class="muted">Romig, zacht en duidelijk uiig. Kies een gerecht waarvan jij denkt dat deze saus er culinair goed bij past.</span></div>
 <div class="group"><div class="label">KIES EEN GERECHT</div><div class="labgrid">${dishes.map(d=>`<button class="element dish" data-dish="${d[0]}" type="button"><span class="emoji">${d[1]}</span>${d[2]}</button>`).join("")}</div></div><div id="applyOut"></div>
 <button id="backLab" class="choice" style="width:100%" type="button">← Terug naar Elementenlab</button>`);
 document.querySelectorAll(".dish").forEach(b=>b.addEventListener("click",()=>answerSoubiseApply(b)));
 $("backLab").addEventListener("click",renderLab);
}
function answerSoubiseApply(btn){
 const v=btn.dataset.dish;
 document.querySelectorAll(".dish").forEach(x=>x.classList.remove("selected")); btn.classList.add("selected");
 if(v==="lamb"){
   const first=!state.applyDone; state.applyDone=true;
   const got=first?reward("soubiseApply",70,20,1):false;
   $("applyOut").innerHTML=`<div class="discovery"><span class="newbadge">${first?"NIEUWE TOEPASSING":"AL ONTDEKT"}</span><div style="font-size:48px;margin:8px">🍖</div><h2>Soubise + lamsvlees</h2><p>De zachte uiensmaak en romigheid van Soubise passen klassiek bij lams- en schapenvlees.</p><b>${got?"+70 XP • +20 coins • 🏅 +1":"Geen extra beloning bij herhalen"}</b><button id="applyAgain" class="primary" type="button">🧪 Verder ontdekken</button></div>`;
   $("applyAgain").addEventListener("click",renderLab); return;
 }
 const f={
   salmon:"🐟 Vis kan met romige sauzen combineren, maar dit is niet de toepassing die we hier zoeken. Kijk naar het uitgesproken uienkarakter en probeer verder.",
   pasta:"🍝 Dit gerecht heeft al een duidelijke tomatenbasis. De Soubise is hier niet de logische klassieke combinatie. Probeer verder.",
   fruit:"🍓 De hartige, romige uiensaus past niet bij deze zoete toepassing. Probeer een hartig hoofdgerecht."
 };
 $("applyOut").innerHTML=`<div class="feedback bad">${f[v]}<br><br><b>Geen strafpunten — toepassen is ook ontdekken.</b></div>`;
}

const rescue=[
 {q:"De saus is hobbelig en niet glad.",opts:[["Krachtig kloppen","whisk"],["Vuur hoger","high"]],a:"whisk",ok:"Goed gezien: kloppen helpt kleine klontjes glad te maken."},
 {q:"De saus is veel te dik geworden.",opts:[["Beetje melk toevoegen","milk"],["Niet meer roeren","stop"]],a:"milk",ok:"Juist: een beetje melk maakt de saus weer soepeler."},
 {q:"De saus dreigt aan te branden.",opts:[["Vuur lager","low"],["Vuur hoger","high"]],a:"low",ok:"Juist: verlaag de hitte en blijf controleren."}
];
function startRescue(){active("navChallenge");state.rescueQ=0;state.rescueMistakes=0;renderRescue();}
function renderRescue(){
 const d=rescue[state.rescueQ];
 setScreen(`<div class="hero"><small>RESCUE CHALLENGE • SERVICE!</small><h2>Red de saus</h2><div>Kijk goed naar de situatie. Jij bepaalt wat er moet gebeuren.</div></div>${rescueVisual(state.rescueQ)}
 <h2 class="center">Situatie ${state.rescueQ+1} van 3</h2><div class="feedback"><b>${d.q}</b></div><div class="group"><div class="grid2">
 ${shuffled(d.opts).map((o,i)=>`<button class="choice rescuePick" data-v="${o[1]}" type="button">${o[0]}</button>`).join("")}</div></div><div id="rescueOut"></div>`);
 document.querySelectorAll(".rescuePick").forEach(b=>b.addEventListener("click",()=>answerRescue(b.dataset.v)));
}
function answerRescue(v){
 const d=rescue[state.rescueQ];
 const buttons=[...document.querySelectorAll(".rescuePick")];
 const chosen=buttons.find(b=>b.dataset.v===v);
 buttons.forEach(b=>b.disabled=true);
 if(v!==d.a){
   state.rescueMistakes++; chosen.classList.add("wrong");
   $("rescueOut").innerHTML='<div class="feedback bad">✕ Niet juist. Bekijk de situatie nog eens en probeer opnieuw.</div>';
   setTimeout(()=>{chosen.classList.remove("wrong");buttons.forEach(b=>b.disabled=false);},2000); return;
 }
 chosen.classList.add("correct");
 const recoverText=state.rescueQ===0?"De klontjes verdwijnen en de saus wordt glad.":state.rescueQ===1?"De saus wordt zichtbaar soepeler en romiger.":"De donkere rand trekt weg; de hitte is onder controle.";
 setTimeout(()=>rescueRecovered(recoverText),350);
 $("rescueOut").innerHTML=`<div class="feedback good">✓ ${d.ok}</div>`;
 setTimeout(()=>{state.rescueQ++; if(state.rescueQ<rescue.length) renderRescue(); else finishRescue();},2400);
}
function finishRescue(){
 state.rescueDone=true;const stars=Math.max(1,3-state.rescueMistakes);
 const rescuePrize=stars===3?{xp:195,coins:75,medals:2}:stars===2?{xp:150,coins:55,medals:1}:{xp:100,coins:35,medals:0};
 const got=reward("rescue",rescuePrize.xp,rescuePrize.coins,rescuePrize.medals);
 setScreen(`<div class="hero"><small>RESCUE CHALLENGE • VOLTOOID</small><h2>Service gered!</h2></div>${visualPan("rescued","✨ Glad en romig — de saus is gered.")}
 <div class="feedback good">🏆 Je redde 3/3 sauzen.</div><div class="result"><div class="stars">${"⭐".repeat(stars)}</div><h2>Rescue Chef</h2><p>${got?`+${rescuePrize.xp} XP • +${rescuePrize.coins} coins${rescuePrize.medals?` • 🏅 +${rescuePrize.medals}`:""}`:"Oefenronde • geen extra XP/coins"}</p><p style="font-size:13px;opacity:.72;margin-top:6px">${stars===3?"Foutloos gered — maximale beloning.":stars===2?"Sterk gered — 1 fout gemaakt.":"Service gered — 2 of meer fouten gemaakt."}</p>
 <button id="again" class="primary" type="button">🔁 Speel Rescue opnieuw</button><button id="backHome" class="choice" style="width:100%;margin-top:12px" type="button">🏠 Naar Start</button></div>`);
 $("again").addEventListener("click",startRescue);$("backHome").addEventListener("click",home);
}
$("navHome").addEventListener("click",home);
$("navTraining").addEventListener("click",startTutorial);
$("navChallenge").addEventListener("click",startRescue);
$("navLab").addEventListener("click",()=>state.freeDone?startLab():startFree());
stats();home();
</script>
</body></html>
