};

  const done=[state.tutorialDone,state.toolsDone,state.freeDone,state.rescueDone].filter(Boolean).length;
  $("progress").style.width=(10+done*22.5)+"%";
}
function active(id){
  ["navHome","navTraining","navChallenge","navLab"].forEach(x=>$(x).classList.toggle("active",x===id));
}
function reward(key,xp,coins,medal=0){
  const k="_reward_"+key;
  if(state[k]) return false;
  state[k]=true; state.xp+=xp; state.coins+=coins; state.medals+=medal; stats(); return true;
}
function img(){return `<img class="pan" src="${pan}" alt="Pan">`;}
function visualPan(kind="",status=""){
 return `<div class="cookstage"><img class="pan" src="${pan}" alt="Pan"><div id="panSauce" class="panSauce ${kind?"show "+kind:""}"></div>${status?`<div id="panStatus" class="panStatus">${status}</div>`:""}</div>`;
}
function rescueVisual(i){
 const visuals=[
  ["lumpy","⚪ Kijk goed: de saus heeft zichtbare klontjes."],
  ["thick","🥣 De saus is zwaar en veel te dik geworden."],
  ["scorch","🔥 Let op: de saus begint onderin donker aan te zetten."]
 ];
 return visualPan(...visuals[i]);
}
function toolVisual(i){
 const visuals=[
  ["lumpy","⚪ Kleine klontjes zijn zichtbaar in de béchamel."],
  ["thick","🥣 Dikke saus blijft aan bodem en randen hangen."],
  ["milk","🥛 Melk en roux moeten nog glad worden gemengd."]
 ];
 return visualPan(...visuals[i]);
}
function rescueRecovered(text){
 const sauce=$("panSauce"), status=$("panStatus");
 if(sauce){sauce.className="panSauce show rescued";}
 if(status){status.textContent="✨ "+text;}
}
function cookingPan(){
 return `<div class="cookstage"><img class="pan" src="${pan}" alt="Pan waarin de saus wordt bereid"><div id="panSauce" class="panSauce"></div><div id="panStatus" class="panStatus">De pan is klaar. Maak je keuzes.</div></div>`;
}
function updatePan(){
 const s=$("panSauce"), t=$("panStatus");
 if(!s||!t) return;
 s.className="panSauce";
 const p=state.picks;
 if(!p.ingredient&&!p.temp&&!p.tech){t.textContent="De pan is klaar. Maak je keuzes.";return;}
 if(p.ingredient==="milk"){s.classList.add("show","milk");t.textContent="🥛 Melk toegevoegd — de vloeistof zit nu in de pan.";}
 else if(p.ingredient==="stock"){s.classList.add("show","thin");t.textContent="🍲 Bouillon toegevoegd.";}
 if(p.temp==="mid"){s.classList.add("show","warming");t.textContent="🔥 Middel vuur — de saus warmt gecontroleerd op.";}
 if(p.temp==="high"){s.classList.add("show","burnt");t.textContent="🔥 Hoog vuur — pas op, de saus kan aanzetten.";}
 if(p.temp==="low"){t.textContent="🔥 Laag vuur — de saus warmt langzaam op.";}
 if(p.tech==="whisk"){t.textContent="🥄 Je klopt met de garde — het mengsel wordt gladder.";}
 if(p.tech==="none"){s.classList.add("show","lumpy");t.textContent="✋ Niet mengen — er ontstaan klontjes.";}
}
function showPanResult(kind,text){
 const s=$("panSauce"), t=$("panStatus");
 if(!s||!t) return;
 s.className="panSauce show "+kind;
 t.textContent=text;
}

function startIngredientMarket(){
 const n=typeof sauceMissionProgress==="function"?sauceMissionProgress():0;
 if(n>0 && n<3){
   active("navHome");
   setScreen(`<div class="hero"><small>CULILAB • WERELDROUTE</small><h2>🥣 Eerst je Sauzenmissie</h2><div>Je bent al begonnen en hebt ${n}/3 sauzen beheerst.</div></div>

   <button id="routeHome" class="choice" style="width:100%;margin-top:10px" type="button">🏠 Terug naar CuliLab Wereld</button></div>`);
   $("resumeSauces").onclick=renderLab; $("routeHome").onclick=home; return;
 }
 startVegetableWorld();
}

 <button id="vegHome" class="choice" style="width:100%;margin-top:12px" type="button">🏠 Terug naar CuliLab Wereld</button></div>`);

function renderVegetableShelf(){
 const cards=vegetableBank.map((v,i)=>`<button class="marketCard vegCard" data-v="${i}" type="button" style="min-height:112px">${vegVisual(v)}<b>${v.name}</b><small style="display:block;margin-top:4px">${v.group}</small></button>`).join("");
 setScreen(`<div class="worldWrap"><div class="worldIntro"><div class="marketTag">🥕 PRODUCTKENNIS</div><h2>Groentenkraam</h2><p>Tik een product aan. Geen toets: eerst gewoon kijken, herkennen en ontdekken.</p></div><div class="marketGrid">${cards}</div><button id="vegBack" class="choice" style="width:100%;margin-top:12px" type="button">← Terug naar Groentemarkt</button></div>`);
 document.querySelectorAll(".vegCard").forEach(b=>b.onclick=()=>showVegetable(+b.dataset.v)); $("vegBack").onclick=startVegetableWorld;
}
function showVegetable(i){
 const v=vegetableBank[i]; vegSeen.add(i);

 {q:"Je hebt 200 g bloem in de kom. Nu moet er 80 g suiker bij. Wat is een handige werkwijze?",choices:["Opnieuw tarra / 0 en suiker toevoegen","Alles uit de kom halen","80 ml suiker afmeten","De kom omwisselen"],a:"Opnieuw tarra / 0 en suiker toevoegen",why:"Door opnieuw tarra te gebruiken kun je het volgende ingrediënt direct in dezelfde kom afwegen."}

 <div class="feedback"><b>🧠 Eerst zelf nadenken</b><br>Droge ingrediënten worden vaak in gram of kilogram aangegeven. Vloeistoffen zie je vaak in ml of liter. Maar in de keuken zijn er uitzonderingen — die ga je zelf ontdekken.</div>

 setScreen(`<div class="hero"><small>TOOL LAB • WEGEN</small><h2>⚖️ Weegschaal Challenge</h2><div>Situatie ${state.scaleQ+1} van ${scaleQs.length}</div></div>
 <div class="result" style="background:#f3efe8"><div style="font-size:58px">⚖️</div><b id="scaleDisplay">${["250 g ?","KOM OP WEEGSCHAAL","1,5 kg","300 ml MELK","500 ml WATER","200 g BLOEM"][state.scaleQ]}</b></div>

function answerScale(btn){
 const d=scaleQs[state.scaleQ],v=btn.dataset.scale;
 document.querySelectorAll("[data-scale]").forEach(x=>x.disabled=true);
 if(v!==d.a){
  state.scaleMistakes++; btn.style.background="#ffe5df";
  $("scaleOut").className="feedback bad";
  $("scaleOut").innerHTML="✕ Nog niet. Denk aan wat het recept aangeeft en probeer opnieuw.";
  setTimeout(()=>{document.querySelectorAll("[data-scale]").forEach(x=>{x.disabled=false;x.style.background=""});$("scaleOut").className="muted center";$("scaleOut").textContent="Probeer opnieuw.";},1600);
  return;
 }
 btn.style.background="#e2f5e5";
 const after=["250 g ✓","0 g • TARRA ✓","1500 g ✓","🥛 MAATBEKER ✓","≈ 500 g WATER ✓","200 g → TARRA → 0 g → +80 g ✓"][state.scaleQ];
 $("scaleDisplay").textContent=after;
 $("scaleOut").className="feedback good"; $("scaleOut").innerHTML="✓ "+d.why;
 setTimeout(()=>{state.scaleQ++;if(state.scaleQ<scaleQs.length)renderScaleQ();else finishScale();},2200);
}

 const stars=state.scaleMistakes===0?3:state.scaleMistakes<=2?2:1;

 setScreen(`<div class="hero"><small>TOOL LAB VOLTOOID</small><h2>⚖️ Wegen in de keuken</h2><div>Je hebt droog/vloeibaar, tarra, g/kg en meten versus wegen toegepast.</div></div>
