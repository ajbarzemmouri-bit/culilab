function stats(){
  $("xp").textContent=state.xp; $("coins").textContent=state.coins; $("medals").textContent=state.medals;
  const done=[state.tutorialDone,state.toolsDone,state.freeDone,state.rescueDone].filter(Boolean).length;
  $("progress").style.width=(10+done*22.5)+"%";
}
function active(id){
  ["navHome","navTraining","navChallenge","navLab"].forEach(x=>$(x).classList.toggle("active",x===id));
}
function reward(key,xp,coins,medal=0){
  const k="_reward_"+key;
  if(state[k]) return false;
  state[k]=true; state.xp+=xp; state.coins+=coins; state.medals+=medal; stats(); return true;
}
function img(){return `<img class="pan" src="${pan}" alt="Pan">`;}
function visualPan(kind="",status=""){
 return `<div class="cookstage"><img class="pan" src="${pan}" alt="Pan"><div id="panSauce" class="panSauce ${kind?"show "+kind:""}"></div>${status?`<div id="panStatus" class="panStatus">${status}</div>`:""}</div>`;
}
function rescueVisual(i){
 const visuals=[
  ["lumpy","⚪ Kijk goed: de saus heeft zichtbare klontjes."],
  ["thick","🥣 De saus is zwaar en veel te dik geworden."],
  ["scorch","🔥 Let op: de saus begint onderin donker aan te zetten."]
 ];
 return visualPan(...visuals[i]);
}
function toolVisual(i){
 const visuals=[
  ["lumpy","⚪ Kleine klontjes zijn zichtbaar in de béchamel."],
  ["thick","🥣 Dikke saus blijft aan bodem en randen hangen."],
  ["milk","🥛 Melk en roux moeten nog glad worden gemengd."]
 ];
 return visualPan(...visuals[i]);
}
function rescueRecovered(text){
 const sauce=$("panSauce"), status=$("panStatus");
 if(sauce){sauce.className="panSauce show rescued";}
 if(status){status.textContent="✨ "+text;}
}
function cookingPan(){
 return `<div class="cookstage"><img class="pan" src="${pan}" alt="Pan waarin de saus wordt bereid"><div id="panSauce" class="panSauce"></div><div id="panStatus" class="panStatus">De pan is klaar. Maak je keuzes.</div></div>`;
}
function updatePan(){
 const s=$("panSauce"), t=$("panStatus");
 if(!s||!t) return;
 s.className="panSauce";
 const p=state.picks;
 if(!p.ingredient&&!p.temp&&!p.tech){t.textContent="De pan is klaar. Maak je keuzes.";return;}
 if(p.ingredient==="milk"){s.classList.add("show","milk");t.textContent="🥛 Melk toegevoegd — de vloeistof zit nu in de pan.";}
 else if(p.ingredient==="stock"){s.classList.add("show","thin");t.textContent="🍲 Bouillon toegevoegd.";}
 if(p.temp==="mid"){s.classList.add("show","warming");t.textContent="🔥 Middel vuur — de saus warmt gecontroleerd op.";}
 if(p.temp==="high"){s.classList.add("show","burnt");t.textContent="🔥 Hoog vuur — pas op, de saus kan aanzetten.";}
 if(p.temp==="low"){t.textContent="🔥 Laag vuur — de saus warmt langzaam op.";}
 if(p.tech==="whisk"){t.textContent="🥄 Je klopt met de garde — het mengsel wordt gladder.";}
 if(p.tech==="none"){s.classList.add("show","lumpy");t.textContent="✋ Niet mengen — er ontstaan klontjes.";}
}
function showPanResult(kind,text){
 const s=$("panSauce"), t=$("panStatus");
 if(!s||!t) return;
 s.className="panSauce show "+kind;
 t.textContent=text;
}

function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function startVegetableRecognition(){
 vegIndex=0;vegScore=0;vegMistakes=0;vegRound=shuffled(vegetableBank.map((_,i)=>i)).slice(0,12);renderVegQuestion();
}
function renderVegQuestion(){
 if(vegIndex>=vegRound.length){finishVegRecognition();return;}
 const correct=vegRound[vegIndex], v=vegetableBank[correct];
 const wrong=shuffled(vegetableBank.map((_,i)=>i).filter(i=>i!==correct)).slice(0,3);
 const options=shuffled([correct,...wrong]);
 setScreen(`<div class="worldWrap"><div class="worldIntro"><div class="marketTag">⚡ HERKENNINGSRONDE • ${vegIndex+1}/${vegRound.length}</div><h2>Welke groente zie je?</h2><p>Herken het product zo snel mogelijk.</p></div><div class="card" style="text-align:center">${vegVisual(v,true)}<div id="vegAnswers" class="marketGrid"></div><div id="vegFeedback" class="feedback" style="display:none;margin-top:12px"></div></div></div>`);
 const box=$("vegAnswers"); options.forEach(idx=>{const b=document.createElement("button");b.type="button";b.className="marketCard";b.textContent=vegetableBank[idx].name;b.onclick=()=>answerVeg(idx,correct,b);box.appendChild(b);});
}
function answerVeg(chosen,correct,b){
 const fb=$("vegFeedback");
 if(chosen!==correct){vegMistakes++;b.classList.add("bad");b.disabled=true;fb.style.display="block";fb.className="feedback bad";fb.textContent="Nog niet — kijk goed naar vorm en product.";return;}
 vegScore++;vegSeen.add(correct);b.classList.add("good");[...$("vegAnswers").children].forEach(x=>x.disabled=true);fb.style.display="block";fb.className="feedback good";fb.textContent=`✓ ${vegetableBank[correct].name} • ${vegetableBank[correct].group}`;setTimeout(()=>{vegIndex++;renderVegQuestion()},850);
}
function finishVegRecognition(){
 const stars=vegMistakes===0?3:vegMistakes<=3?2:1;
 const got=reward("vegRecognition",stars===3?100:stars===2?75:50,stars===3?30:20,stars===3?1:0);
 setScreen(`<div class="worldWrap"><div class="worldIntro"><div class="marketTag">🥕 GROENTEMARKT</div><h2>Herkenningsronde voltooid</h2><p>Je hebt ${vegScore}/${vegRound.length} producten herkend.</p></div><div class="card" style="text-align:center"><div style="font-size:58px">🧺</div><h2>${"⭐".repeat(stars)}</h2><p>Foute pogingen: ${vegMistakes}</p><b>${got?"Nieuwe beloning verdiend":"Oefenronde voltooid"}</b></div><button id="vegAgain" class="primary" type="button">⚡ Nog een herkenningsronde</button><button id="vegMarket" class="choice" style="width:100%;margin-top:10px" type="button">🥕 Terug naar Groentemarkt</button></div>`);
 $("vegAgain").onclick=startVegetableRecognition; $("vegMarket").onclick=startVegetableWorld;
}

 <button id="scaleHub" class="choice" style="width:100%;margin-top:10px" type="button">🧰 Terug naar Tool Lab</button>`);
 $("scaleAgain").onclick=()=>{state.scaleQ=0;state.scaleMistakes=0;renderScaleQ();};
 $("scaleHub").onclick=startToolLab;
}

const measureQs=[
 {q:"Een recept vraagt ½ liter melk. Hoeveel milliliter is dat?", choices:["250 ml","500 ml","750 ml","1000 ml"], a:"500 ml", why:"½ liter is 500 ml."},
 {q:"Je hebt 3 dl melk nodig. Hoeveel milliliter meet je af?", choices:["30 ml","300 ml","500 ml","3000 ml"], a:"300 ml", why:"1 dl = 100 ml, dus 3 dl = 300 ml."},
 {q:"Een recept vraagt 750 ml. Hoeveel liter is dat?", choices:["0,075 L","0,75 L","7,5 L","75 L"], a:"0,75 L", why:"1000 ml = 1 liter, dus 750 ml = 0,75 liter."},
 {q:"Je hebt ¼ liter bouillon nodig. Hoeveel milliliter is dat?", choices:["25 ml","100 ml","250 ml","400 ml"], a:"250 ml", why:"¼ van 1000 ml is 250 ml."}
];
function startToolLab(){
 active("navTraining");
 setScreen(`<div class="hero"><small>CULILAB • TOOL LAB</small><h2>🧰 Ontdek je keukengereedschap</h2><div>Herken een tool en ontdek welke kennis ermee wordt geopend.</div></div>
 <div class="toolhub"><b>Jouw eerste tools</b><div class="toolcards">
 <button id="oldTools" class="toolcard" type="button"><span class="big">🥄</span>Garde & spatel<br><span class="muted">Herkennen & toepassen</span></button>
 <button id="measureTool" class="toolcard" type="button"><span class="big">🥛</span>Maatbeker<br><span class="muted">Meten & omrekenen</span></button>
 <button id="scaleTool" class="toolcard" type="button"><span class="big">⚖️</span>Weegschaal<br><span class="muted">Wegen • tarra • droog/nat</span></button>
 <div class="toolcard locked"><span class="big">🔪</span>Koksmes<br><span class="muted">Binnenkort</span></div>
 </div></div>
 <button id="toolBack" class="choice" style="width:100%" type="button">← Terug</button>`);
 $("oldTools").onclick=startTools;
 $("measureTool").onclick=startMeasureIntro;
 $("scaleTool").onclick=startScaleIntro;
 $("toolBack").onclick=home;
}
function startMeasureIntro(){
 active("navTraining");
 setScreen(`<div class="hero"><small>TOOL LAB • NIEUWE TOOL</small><h2>🥛 Maatbeker</h2><div>Met een maatbeker meet je vloeistoffen af. De schaal kan ml, dl of liter tonen.</div></div>
 <div class="feedback"><b>📏 Chef-tip</b><br>Onthoud niet alleen een tabel — gebruik de verhoudingen tijdens het koken.</div>
 <div class="result"><b>Basis die je nodig hebt</b><p>1 liter = 1000 ml<br>1 dl = 100 ml<br>½ liter = 500 ml<br>¼ liter = 250 ml</p></div>
 <button id="measureStart" class="primary" type="button">🎮 Start Meten & Omrekenen</button>
 <button id="measureBack" class="choice" style="width:100%;margin-top:10px" type="button">← Tool Lab</button>`);
 $("measureStart").onclick=()=>{state.measureQ=0;state.measureMistakes=0;renderMeasureQ();};
 $("measureBack").onclick=startToolLab;
}
function renderMeasureQ(){
 const d=measureQs[state.measureQ], opts=shuffled(d.choices);
 setScreen(`<div class="hero"><small>TOOL LAB • METEN</small><h2>🥛 Maatbeker Challenge</h2><div>Vraag ${state.measureQ+1} van ${measureQs.length}</div></div>
 <div class="measureCup">
 <span class="measureLabel" style="top:8px">1000 ml</span><span class="measureLabel" style="top:62px">750 ml</span><span class="measureLabel" style="top:116px">500 ml</span><span class="measureLabel" style="top:172px">250 ml</span>
 </div>
 <div class="feedback"><b>${d.q}</b></div>
 <div class="convgrid">${opts.map(x=>`<button class="convbtn" data-answer="${x}" type="button">${x}</button>`).join("")}</div>
 <div id="measureOut" class="muted center" style="margin-top:12px">Kies je antwoord.</div>`);
 document.querySelectorAll(".convbtn").forEach(b=>b.onclick=()=>answerMeasure(b));
}
function answerMeasure(btn){
 const d=measureQs[state.measureQ], v=btn.dataset.answer;
 document.querySelectorAll(".convbtn").forEach(x=>x.disabled=true);
 if(v!==d.a){
   state.measureMistakes++;
   btn.style.background="#ffe5df";
   $("measureOut").className="feedback bad";
   $("measureOut").innerHTML="✕ Nog niet. Kijk naar de verhouding en probeer opnieuw.";
   setTimeout(()=>{document.querySelectorAll(".convbtn").forEach(x=>{x.disabled=false;x.style.background=""});$("measureOut").className="muted center";$("measureOut").textContent="Probeer opnieuw.";},1600);
   return;
 }
 btn.style.background="#e2f5e5";
 $("measureOut").className="feedback good";
 $("measureOut").innerHTML="✓ "+d.why;
 setTimeout(()=>{state.measureQ++; if(state.measureQ<measureQs.length)renderMeasureQ();else finishMeasure();},1700);
}
function finishMeasure(){
 const stars=Math.max(1,3-Math.floor(state.measureMistakes/2));
 const prize=stars===3?[80,25,1]:stars===2?[60,18,0]:[40,12,0];
 const wasRewarded=!!state._reward_measureLab;
 const got=reward("measureLab",prize[0],prize[1],prize[2]);
 setScreen(`<div class="hero"><small>TOOL LAB VOLTOOID</small><h2>🥛 Maatbeker beheerst</h2><div>Je hebt ml, dl en liter in praktijksituaties omgerekend.</div></div>
 <div class="result"><div class="stars">${"⭐".repeat(stars)}</div><h2>Meten & Omrekenen</h2><p>Fouten: ${state.measureMistakes}</p><b>${!wasRewarded&&got?`+${prize[0]} XP • +${prize[1]} coins${prize[2]?" • 🏅 +1":""}`:"Oefenronde — beloning is al eerder verdiend"}</b></div>
 <button id="measureAgain" class="primary" type="button">🔁 Nog een ronde</button>
 <button id="measureHub" class="choice" style="width:100%;margin-top:10px" type="button">🧰 Terug naar Tool Lab</button>`);
 $("measureAgain").onclick=()=>{state.measureQ=0;state.measureMistakes=0;renderMeasureQ();};
 $("measureHub").onclick=startToolLab;
}

</script>
