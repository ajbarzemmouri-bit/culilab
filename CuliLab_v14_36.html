<body>
<div id="v12app">
  <header class="v12head">
    <div class="v12brand">🧪 CuliLab</div>
    <div class="v12sub">CHEF ACADEMY • LEER → ONTDEK → BEHEERS</div>
    <div class="stats">
      <span class="pill">👨‍🍳 Lv. <b id="level">2</b></span>
      <span class="pill">⭐ <b id="xp">0</b> XP</span>
      <span class="pill">🪙 <b id="coins">0</b></span>
      <span class="pill">🏅 <b id="medals">0</b></span>
    </div>
    <div class="bar"><i id="progress"></i></div>
  </header>

  <nav class="nav">
  <button id="navHome" type="button">🏠<span>Start</span></button>
  <button id="navTraining" type="button">🎓<span>Leren</span></button>
  <button id="navChallenge" type="button">🔥<span>Challenges</span></button>
  <button id="navProgress" type="button">🏆<span>Voortgang</span></button>
  <button id="navMore" type="button">☰<span>Meer</span></button>
</nav>
<button id="navLab" type="button" hidden aria-hidden="true"></button>
  <main id="screen"></main>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
function shuffled(arr){ return [...arr].sort(()=>Math.random()-0.5); }
const state = {
  xp:0, coins:0, medals:0,
  tutorialDone:false, toolsDone:false, freeDone:false, rescueDone:false,
  tutorialStep:0, toolQ:0, toolMistakes:0, rescueQ:0, rescueMistakes:0,
  picks:{ingredient:null,temp:null,tech:null},
  discovered:["bechamel"], pendingDiscovery:null, sauceMissionDone:[], labPick:null, mornayDone:false, soubiseDone:false, mustardDone:false, applyDone:false, bechamelApply:[], mornayApply:[], mustardApply:[], tasteFound:{}, doseDone:{}, doseStep:{}, measureQ:0, measureMistakes:0, scaleQ:0, scaleMistakes:0
};
const pan = "culilab-pan.png";
const garde = "culilab-garde.png?v=1200";
const spatel = "culilab-spatel.png?v=1200";

function stats(){
  $("xp").textContent=state.xp; $("coins").textContent=state.coins; $("medals").textContent=state.medals;
  const done=[state.tutorialDone,state.toolsDone,state.freeDone,state.rescueDone].filter(Boolean).length;
  $("progress").style.width=(10+done*22.5)+"%";
}
function active(id){
  ["navHome","navTraining","navChallenge","navLab"].forEach(x=>$(x).classList.toggle("active",x===id));
}
function reward(key,xp,coins,medal=0){
  const k="_reward_"+key;
  if(state[k]) return false;
  state[k]=true; state.xp+=xp; state.coins+=coins; state.medals+=medal; stats(); return true;
}
function img(){return `<img class="pan" src="${pan}" alt="Pan">`;}
function visualPan(kind="",status=""){
 return `<div class="cookstage"><img class="pan" src="${pan}" alt="Pan"><div id="panSauce" class="panSauce ${kind?"show "+kind:""}"></div>${status?`<div id="panStatus" class="panStatus">${status}</div>`:""}</div>`;
}
function rescueVisual(i){
 const visuals=[
  ["lumpy","⚪ Kijk goed: de saus heeft zichtbare klontjes."],
  ["thick","🥣 De saus is zwaar en veel te dik geworden."],
  ["scorch","🔥 Let op: de saus begint onderin donker aan te zetten."]
 ];
 return visualPan(...visuals[i]);
}
function toolVisual(i){
 const visuals=[
  ["lumpy","⚪ Kleine klontjes zijn zichtbaar in de béchamel."],
  ["thick","🥣 Dikke saus blijft aan bodem en randen hangen."],
  ["milk","🥛 Melk en roux moeten nog glad worden gemengd."]
 ];
 return visualPan(...visuals[i]);
}
function rescueRecovered(text){
 const sauce=$("panSauce"), status=$("panStatus");
 if(sauce){sauce.className="panSauce show rescued";}
 if(status){status.textContent="✨ "+text;}
}
function cookingPan(){
 return `<div class="cookstage"><img class="pan" src="${pan}" alt="Pan waarin de saus wordt bereid"><div id="panSauce" class="panSauce"></div><div id="panStatus" class="panStatus">De pan is klaar. Maak je keuzes.</div></div>`;
}
function updatePan(){
 const s=$("panSauce"), t=$("panStatus");
 if(!s||!t) return;
 s.className="panSauce";
 const p=state.picks;
 if(!p.ingredient&&!p.temp&&!p.tech){t.textContent="De pan is klaar. Maak je keuzes.";return;}
 if(p.ingredient==="milk"){s.classList.add("show","milk");t.textContent="🥛 Melk toegevoegd — de vloeistof zit nu in de pan.";}
 else if(p.ingredient==="stock"){s.classList.add("show","thin");t.textContent="🍲 Bouillon toegevoegd.";}
 if(p.temp==="mid"){s.classList.add("show","warming");t.textContent="🔥 Middel vuur — de saus warmt gecontroleerd op.";}
 if(p.temp==="high"){s.classList.add("show","burnt");t.textContent="🔥 Hoog vuur — pas op, de saus kan aanzetten.";}
 if(p.temp==="low"){t.textContent="🔥 Laag vuur — de saus warmt langzaam op.";}
 if(p.tech==="whisk"){t.textContent="🥄 Je klopt met de garde — het mengsel wordt gladder.";}
 if(p.tech==="none"){s.classList.add("show","lumpy");t.textContent="✋ Niet mengen — er ontstaan klontjes.";}
}
function showPanResult(kind,text){
 const s=$("panSauce"), t=$("panStatus");
 if(!s||!t) return;
 s.className="panSauce show "+kind;
 t.textContent=text;
}
function setScreen(html){$("screen").innerHTML=html; window.scrollTo({top:0,behavior:"auto"});}
function home(){
  active("navHome"); stats();
  const sauceReady = state.freeDone;
  const sauceDone = state.mornayDone || state.soubiseDone || state.mustardDone;
  setScreen(`<div class="worldWrap">
    <div class="worldIntro">
      <h2>CuliLab Wereld</h2>
      <p>Ontdek de keuken. Elke vaardigheid opent een nieuw pad.</p>
      <button id="testMode" class="choice" style="width:100%;margin-top:10px" type="button">🧪 Testmodus — direct naar onderdeel</button>
    </div>
    <div class="worldMap">
      <div class="worldPath"></div>
      <div class="worldYou">👨‍🍳 JIJ BENT HIER</div>

      <div class="worldStop left">
        <button id="worldAcademy" class="worldNode ready ${state.tutorialDone?"done":""}" type="button">
          <span class="worldIcon">🏫</span><b>Chef Academy</b>
          <small>${state.tutorialDone?"Training voltooid • opnieuw oefenen kan":"Begin hier • leer je eerste basissaus"}</small>
        </button>
      </div>

      <div class="worldStop right">
        <button id="worldTools" class="worldNode ${state.toolsDone?"done":"ready"}" type="button">
          <span class="worldIcon">🧰</span><b>Tool Workshop</b>
          <small>Gereedschap • meten • wegen</small>
        </button>
      </div>

      <div class="worldStop left">
        <button id="worldService" class="worldNode ${state.tutorialDone?"ready":"locked"}" type="button">
          <span class="worldIcon">🔥</span><b>Servicekeuken</b>
          <small>${state.tutorialDone?"Red sauzen onder druk":"Voltooi eerst je eerste training"}</small>
        </button>
      </div>

      <div class="worldStop right">
        <button id="worldSauce" class="worldNode ${sauceReady?"ready "+(sauceDone?"done":""):"locked"}" type="button">
          <span class="worldIcon">🥣</span><b>Sausatelier</b>
          <small>${sauceReady?"Combineer en ontdek nieuwe sauzen":"Beheers eerst zelfstandig béchamel"}</small>
        </button>
      </div>

      <div class="worldStop left">
        <button id="worldMarket" class="worldNode ${sauceDone?"ready":"locked"}" type="button" ${sauceDone?"":"disabled"}>
          <span class="worldIcon">🥕</span><b>Groentemarkt</b>
          <small>${sauceDone?"Ontdek en herken 24 groenten":"Ontdek eerst een nieuwe saus"}</small>
        </button>
      </div>

      <div class="worldStop right">
        <button class="worldNode locked" type="button" disabled>
          <span class="worldIcon">🍽️</span><b>Restaurant</b>
          <small>Binnenkort • combineer alles tijdens de service</small>
        </button>
      </div>
    </div>
    <div class="worldHint">Nieuwe gebieden verschijnen terwijl jouw culinaire wereld groeit.</div>
  </div>`);

  $("worldAcademy").addEventListener("click", startTutorial);
  $("worldTools").addEventListener("click", startToolLab);
  $("worldService").addEventListener("click", ()=>state.tutorialDone?startRescue():startTutorial());
  $("worldSauce").addEventListener("click", ()=>state.freeDone?startLab():startFree());
  if($("worldMarket")) $("worldMarket").addEventListener("click", startIngredientMarket);
  if($("testMode")) $("testMode").addEventListener("click", openTestMode);
}


function openTestMode(){
 active("navHome");
 setScreen(`<div class="worldWrap"><div class="worldIntro"><div class="marketTag">🧪 ONTWIKKELMODUS</div><h2>Direct testen</h2><p>Sla de normale route tijdelijk over. Dit scherm is alleen bedoeld voor onze testversies.</p></div>
 <div class="testPanel"><div class="testGrid">
 <button id="testMaterial" class="choice" type="button">📱 Chef Swipe • Materialen</button>
 <button id="testVeg" class="choice" type="button">🥕 Groentemarkt</button>
 <button id="testSauce" class="choice" type="button">🥣 Sausatelier</button>
 <button id="testTools" class="choice" type="button">🧰 Gereedschap</button>
 <button id="testRescue" class="choice" type="button">🔥 Rescue</button>
 <button id="testOdd" class="choice" type="button">👀 Wat hoort er niet bij?</button>
 <button id="testAcademy" class="choice" type="button">🏫 Chef Academy</button>
 </div></div><button id="testBack" class="choice" style="width:100%" type="button">← Terug naar CuliLab Wereld</button></div>`);
 $("testMaterial").onclick=startChefSwipe; $("testVeg").onclick=startVegetableWorld; $("testSauce").onclick=renderLab; $("testTools").onclick=startToolLab; $("testRescue").onclick=startRescue; $("testAcademy").onclick=startTutorial;
 $("testOdd").onclick=()=>{ if(typeof startOddOneOut==="function") startOddOneOut(); else if(typeof startOddGame==="function") startOddGame(); else openChallenges(); };
 $("testBack").onclick=home;
}

 setScreen(`<div class="hero"><small>TOOL LAB • NIEUWE TOOL</small><h2>⚖️ Weegschaal</h2><div>Ontdek wanneer je weegt, wanneer je meet en waarom tarra zo handig is.</div></div>

 <div class="toolhub"><b>Wat ga je oefenen?</b><p>⚖️ gram & kilogram • 🥣 tarra / nulstellen • 🌾 droog versus vloeibaar • 🥛 meten of wegen</p></div>

 $("scaleStart").onclick=()=>{state.scaleQ=0;state.scaleMistakes=0;renderScaleQ();};
 $("scaleBack").onclick=startToolLab;
}
function renderScaleQ(){
 const d=scaleQs[state.scaleQ], opts=shuffled(d.choices);
 setScreen(`<div class="hero"><small>TOOL LAB • WEGEN</small><h2>⚖️ Weegschaal Challenge</h2><div>Situatie ${state.scaleQ+1} van ${scaleQs.length}</div></div>
 <div class="result" style="background:#f3efe8"><div style="font-size:58px">⚖️</div><b id="scaleDisplay">${["250 g ?","KOM OP WEEGSCHAAL","1,5 kg","300 ml MELK","500 ml WATER","200 g BLOEM"][state.scaleQ]}</b></div>
 <div class="feedback"><b>${d.q}</b></div>
 <div class="convgrid">${opts.map(x=>`<button class="convbtn" data-scale="${x}" type="button">${x}</button>`).join("")}</div>
 <div id="scaleOut" class="muted center" style="margin-top:12px">Kies wat jij in de keuken zou doen.</div>`);
 document.querySelectorAll("[data-scale]").forEach(b=>b.onclick=()=>answerScale(b));
}
function answerScale(btn){
 const d=scaleQs[state.scaleQ],v=btn.dataset.scale;
 document.querySelectorAll("[data-scale]").forEach(x=>x.disabled=true);
 if(v!==d.a){
  state.scaleMistakes++; btn.style.background="#ffe5df";
  $("scaleOut").className="feedback bad";
  $("scaleOut").innerHTML="✕ Nog niet. Denk aan wat het recept aangeeft en probeer opnieuw.";
  setTimeout(()=>{document.querySelectorAll("[data-scale]").forEach(x=>{x.disabled=false;x.style.background=""});$("scaleOut").className="muted center";$("scaleOut").textContent="Probeer opnieuw.";},1600);
  return;
 }
 btn.style.background="#e2f5e5";
 const after=["250 g ✓","0 g • TARRA ✓","1500 g ✓","🥛 MAATBEKER ✓","≈ 500 g WATER ✓","200 g → TARRA → 0 g → +80 g ✓"][state.scaleQ];
 $("scaleDisplay").textContent=after;
 $("scaleOut").className="feedback good"; $("scaleOut").innerHTML="✓ "+d.why;
 setTimeout(()=>{state.scaleQ++;if(state.scaleQ<scaleQs.length)renderScaleQ();else finishScale();},2200);
}
function finishScale(){
 const stars=state.scaleMistakes===0?3:state.scaleMistakes<=2?2:1;
 const prize=stars===3?[100,30,1]:stars===2?[75,22,0]:[50,15,0];
 const got=reward("scaleLab",prize[0],prize[1],prize[2]);
 setScreen(`<div class="hero"><small>TOOL LAB VOLTOOID</small><h2>⚖️ Wegen in de keuken</h2><div>Je hebt droog/vloeibaar, tarra, g/kg en meten versus wegen toegepast.</div></div>
 <div class="result"><div class="stars">${"⭐".repeat(stars)}</div><h2>Weegschaal beheerst</h2><p>Fouten: ${state.scaleMistakes}</p><b>${got?`+${prize[0]} XP • +${prize[1]} coins${prize[2]?" • 🏅 +1":""}`:"Oefenronde — beloning is al eerder verdiend"}</b></div>

 <button id="scaleHub" class="choice" style="width:100%;margin-top:10px" type="button">🧰 Terug naar Tool Lab</button>`);
 $("scaleAgain").onclick=()=>{state.scaleQ=0;state.scaleMistakes=0;renderScaleQ();};
 $("scaleHub").onclick=startToolLab;
}

const boardUses={'Rode snijplank':'Rauw vlees','Blauwe snijplank':'Vis','Groene snijplank':'Groente & fruit','Gele snijplank':'Gevogelte','Witte snijplank':'Brood, kaas & zuivel'};
let chefSwipeDeck=[],chefSwipeIndex=0,chefSwipeScore=0,chefSwipeMistakes=0,chefSwipeTouchY=null,chefStickStart=null;
function startChefSwipe(){
 active("navTraining"); chefSwipeIndex=0;chefSwipeScore=0;chefSwipeMistakes=0;
 chefSwipeDeck=shuffled(chefSwipeCards).slice(0,10); renderChefSwipe();
}
function renderChefSwipe(){
 if(chefSwipeIndex>=chefSwipeDeck.length) return finishChefSwipe();
 const c=chefSwipeDeck[chefSwipeIndex], quiz=(chefSwipeIndex%3===2);
 const pct=Math.round((chefSwipeIndex/chefSwipeDeck.length)*100);
 let body='';
 if(!quiz){
   body=`<div class="swipeBody"><div class="marketTag">ONTDEK</div><h2>${c.name}</h2><p>${c.tip}</p>${boardUses[c.name]?`<div class="boardUse">${boardUses[c.name]}</div>`:''}</div><div class="swipeHint">Swipe omhoog of gebruik de controller</div>`;
 } else {
   const wrong=shuffled(chefSwipeCards.filter(x=>x.name!==c.name)).slice(0,2).map(x=>x.name);
   const choices=shuffled([c.name,...wrong]);
   body=`<div class="swipeBody"><div class="marketTag">SNELLE CHECK</div><h2>Wat zie je?</h2><p>Kies het juiste materiaal. Daarna ga je meteen door.</p><div style="margin-top:14px">${choices.map(x=>`<button class="swipeChoice" data-v="${x}" type="button">${x}</button>`).join('')}</div><div id="swipeFeedback" class="swipeScore">🔥 Combo: ${chefSwipeScore}</div></div>`;
 }
 setScreen(`<div class="chefSwipeShell"><div class="swipeTop"><b>📱 Chef Swipe</b><span class="swipePill">${chefSwipeIndex+1} / ${chefSwipeDeck.length}</span></div><div class="swipeProgress"><i style="width:${pct}%"></i></div><div id="swipeCard" class="swipeCard"><img class="swipeImg" src="${c.img}" alt="${c.name}">${body}</div>${quiz?'':`<div id="swipePad" class="swipePad" role="button" tabindex="0" aria-label="Volgende kaart"><div><div class="swipePadRing"><span class="swipePadArrow">↑</span><span id="swipeStick" class="swipeStick"></span></div><div class="swipePadLabel">VOLGENDE</div></div></div>`}<button id="swipeExit" class="choice" style="width:100%;margin-top:9px" type="button">← Testmodus</button></div>`);
 const card=$("swipeCard");
 if(!quiz){
   card.addEventListener('touchstart',e=>chefSwipeTouchY=e.touches[0].clientY,{passive:true});
   card.addEventListener('touchend',e=>{if(chefSwipeTouchY!==null && chefSwipeTouchY-e.changedTouches[0].clientY>45) nextChefSwipe();chefSwipeTouchY=null;},{passive:true});
   setupSwipePad();
 } else document.querySelectorAll('.swipeChoice').forEach(b=>b.onclick=()=>answerChefSwipe(b,c.name));
 $("swipeExit").onclick=openTestMode;
}

function setupSwipePad(){
 const pad=$("swipePad"),stick=$("swipeStick"); if(!pad||!stick)return;
 const reset=()=>{stick.style.transform='translate(0,0)';chefStickStart=null;};
 pad.addEventListener('pointerdown',e=>{chefStickStart={x:e.clientX,y:e.clientY};pad.setPointerCapture(e.pointerId);});
 pad.addEventListener('pointermove',e=>{if(!chefStickStart)return;let dx=e.clientX-chefStickStart.x,dy=e.clientY-chefStickStart.y;const m=24,len=Math.hypot(dx,dy)||1;if(len>m){dx=dx/len*m;dy=dy/len*m}stick.style.transform=`translate(${dx}px,${dy}px)`;});
 pad.addEventListener('pointerup',e=>{if(!chefStickStart)return;const dy=e.clientY-chefStickStart.y;reset();if(dy<-18)nextChefSwipe();});
 pad.addEventListener('pointercancel',reset); pad.onclick=e=>{if(!chefStickStart)nextChefSwipe();};
 pad.onkeydown=e=>{if(e.key==='ArrowUp'||e.key==='Enter'||e.key===' '){e.preventDefault();nextChefSwipe();}};
}
function nextChefSwipe(){const c=$("swipeCard");if(c)c.classList.add('fly');setTimeout(()=>{chefSwipeIndex++;renderChefSwipe();},180);}
function answerChefSwipe(btn,correct){
 if(btn.dataset.v===correct){btn.classList.add('good');chefSwipeScore++;$("swipeFeedback").textContent='✓ Goed! +1 combo';document.querySelectorAll('.swipeChoice').forEach(x=>x.disabled=true);setTimeout(()=>{chefSwipeIndex++;renderChefSwipe();},650);}
 else {btn.classList.add('bad');btn.disabled=true;chefSwipeMistakes++;chefSwipeScore=0;$("swipeFeedback").textContent='Nog niet — kijk goed en probeer opnieuw.';}
}
function finishChefSwipe(){
 const stars=chefSwipeMistakes===0?3:chefSwipeMistakes<=2?2:1;
 setScreen(`<div class="hero"><small>MATERIALENWERKPLAATS</small><h2>📱 Swipe-sessie voltooid</h2><div>Kort gekeken, herkend en toegepast.</div></div><div class="result"><div class="stars">${'⭐'.repeat(stars)}</div><h2>Chef Swipe</h2><p>Snelle checks goed: ${chefSwipeScore}<br>Foute pogingen: ${chefSwipeMistakes}</p><b>Nieuwe ronde = nieuwe volgorde</b></div><button id="swipeAgain" class="primary" type="button">🔥 Nog een ronde</button><button id="swipeDone" class="choice" style="width:100%;margin-top:10px" type="button">🧪 Terug naar Testmodus</button>`);
 $("swipeAgain").onclick=startChefSwipe;$("swipeDone").onclick=openTestMode;
}

function startToolLab(){
 active("navTraining");
 setScreen(`<div class="hero"><small>CULILAB • TOOL LAB</small><h2>🧰 Ontdek je keukengereedschap</h2><div>Herken een tool en ontdek welke kennis ermee wordt geopend.</div></div>
 <div class="toolhub"><b>Jouw eerste tools</b><div class="toolcards">
 <button id="chefSwipeTool" class="toolcard" type="button"><span class="big">📱</span>Chef Swipe<br><span class="muted">Swipe • herken • kies</span></button>
 <button id="oldTools" class="toolcard" type="button"><span class="big">🥄</span>Garde & spatel<br><span class="muted">Herkennen & toepassen</span></button>
 <button id="measureTool" class="toolcard" type="button"><span class="big">🥛</span>Maatbeker<br><span class="muted">Meten & omrekenen</span></button>
 <button id="scaleTool" class="toolcard" type="button"><span class="big">⚖️</span>Weegschaal<br><span class="muted">Wegen • tarra • droog/nat</span></button>
 <div class="toolcard locked"><span class="big">🔪</span>Koksmes<br><span class="muted">Binnenkort</span></div>
 </div></div>
 <button id="toolBack" class="choice" style="width:100%" type="button">← Terug</button>`);
 $("chefSwipeTool").onclick=startChefSwipe;
 $("oldTools").onclick=startTools;
 $("measureTool").onclick=startMeasureIntro;
 $("scaleTool").onclick=startScaleIntro;
 $("toolBack").onclick=home;
}
function startMeasureIntro(){
 active("navTraining");
 setScreen(`<div class="hero"><small>TOOL LAB • NIEUWE TOOL</small><h2>🥛 Maatbeker</h2><div>Met een maatbeker meet je vloeistoffen af. De schaal kan ml, dl of liter tonen.</div></div>
 <div class="feedback"><b>📏 Chef-tip</b><br>Onthoud niet alleen een tabel — gebruik de verhoudingen tijdens het koken.</div>
 <div class="result"><b>Basis die je nodig hebt</b><p>1 liter = 1000 ml<br>1 dl = 100 ml<br>½ liter = 500 ml<br>¼ liter = 250 ml</p></div>
 <button id="measureStart" class="primary" type="button">🎮 Start Meten & Omrekenen</button>
 <button id="measureBack" class="choice" style="width:100%;margin-top:10px" type="button">← Tool Lab</button>`);
 $("measureStart").onclick=()=>{state.measureQ=0;state.measureMistakes=0;renderMeasureQ();};
 $("measureBack").onclick=startToolLab;
}
function renderMeasureQ(){
 const d=measureQs[state.measureQ], opts=shuffled(d.choices);
 setScreen(`<div class="hero"><small>TOOL LAB • METEN</small><h2>🥛 Maatbeker Challenge</h2><div>Vraag ${state.measureQ+1} van ${measureQs.length}</div></div>
 <div class="measureCup">
 <span class="measureLabel" style="top:8px">1000 ml</span><span class="measureLabel" style="top:62px">750 ml</span><span class="measureLabel" style="top:116px">500 ml</span><span class="measureLabel" style="top:172px">250 ml</span>
 </div>
 <div class="feedback"><b>${d.q}</b></div>
 <div class="convgrid">${opts.map(x=>`<button class="convbtn" data-answer="${x}" type="button">${x}</button>`).join("")}</div>
 <div id="measureOut" class="muted center" style="margin-top:12px">Kies je antwoord.</div>`);
 document.querySelectorAll(".convbtn").forEach(b=>b.onclick=()=>answerMeasure(b));
}
function answerMeasure(btn){
 const d=measureQs[state.measureQ], v=btn.dataset.answer;
 document.querySelectorAll(".convbtn").forEach(x=>x.disabled=true);
 if(v!==d.a){
   state.measureMistakes++;
   btn.style.background="#ffe5df";
   $("measureOut").className="feedback bad";
   $("measureOut").innerHTML="✕ Nog niet. Kijk naar de verhouding en probeer opnieuw.";
   setTimeout(()=>{document.querySelectorAll(".convbtn").forEach(x=>{x.disabled=false;x.style.background=""});$("measureOut").className="muted center";$("measureOut").textContent="Probeer opnieuw.";},1600);
   return;
 }
 btn.style.background="#e2f5e5";
 $("measureOut").className="feedback good";
 $("measureOut").innerHTML="✓ "+d.why;
 setTimeout(()=>{state.measureQ++; if(state.measureQ<measureQs.length)renderMeasureQ();else finishMeasure();},1700);
}
function finishMeasure(){
 const stars=Math.max(1,3-Math.floor(state.measureMistakes/2));
 const prize=stars===3?[80,25,1]:stars===2?[60,18,0]:[40,12,0];
 const wasRewarded=!!state._reward_measureLab;
 const got=reward("measureLab",prize[0],prize[1],prize[2]);
 setScreen(`<div class="hero"><small>TOOL LAB VOLTOOID</small><h2>🥛 Maatbeker beheerst</h2><div>Je hebt ml, dl en liter in praktijksituaties omgerekend.</div></div>
 <div class="result"><div class="stars">${"⭐".repeat(stars)}</div><h2>Meten & Omrekenen</h2><p>Fouten: ${state.measureMistakes}</p><b>${!wasRewarded&&got?`+${prize[0]} XP • +${prize[1]} coins${prize[2]?" • 🏅 +1":""}`:"Oefenronde — beloning is al eerder verdiend"}</b></div>
 <button id="measureAgain" class="primary" type="button">🔁 Nog een ronde</button>
 <button id="measureHub" class="choice" style="width:100%;margin-top:10px" type="button">🧰 Terug naar Tool Lab</button>`);
 $("measureAgain").onclick=()=>{state.measureQ=0;state.measureMistakes=0;renderMeasureQ();};
 $("measureHub").onclick=startToolLab;
}

</script>

        <div style="margin-top:10px;padding:12px;border-radius:14px;background:#f3eee5;text-align:center;font-weight:800">
          🔒 Elementenlab — eerst Béchamel beheersen
        </div>
      </div>
      <button class="choice" style="margin-top:14px;width:100%" onclick="resetToTraining()">🎓 Verder leren</button>

}
