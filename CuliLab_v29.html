<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CuliLab • FoodRush Link</title>
<style>
/* ============================================================
   CuliLab: Sauzenlab — standalone
   Eén schone bron. Geen aparte "patch"-scripts meer: alle fixes
   en uitbreidingen zitten in de hoofdlogica hieronder.
   ============================================================ */
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
:root{
  --cream:#f7f0e3; --dark:#20150e; --gold:#f5a019; --orange:#ed7410;
  --green:#e7f6e6; --red:#fde5df; --ink:#29231e; --paper:#fff;
}
body{margin:0;background:#17110d;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
.app{max-width:460px;margin:auto;min-height:100vh;background:var(--cream);overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

header{padding:18px 18px 14px;color:#fff;background:linear-gradient(135deg,#21160f,#54351f)}
.brandrow{display:flex;justify-content:space-between;align-items:flex-start}
.brand{font-size:26px;font-weight:900}
.tag{font-size:11px;letter-spacing:1.2px;opacity:.75;margin-top:2px}
.rank{font-size:11px;font-weight:800;background:#ffffff18;border:1px solid #ffffff2a;border-radius:14px;padding:6px 10px;white-space:nowrap}
.stats{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:800;background:#ffffff14;border:1px solid #ffffff22;padding:7px 10px;border-radius:16px}
.progress{height:7px;background:#ffffff20;border-radius:8px;margin-top:12px;overflow:hidden}
.progress i{display:block;height:100%;background:#ffc94f;transition:.3s}

nav.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:9px 12px;background:#2a1b12;position:sticky;top:0;z-index:20}
nav.tabs button{margin:0;padding:9px 3px;background:#ffffff12;border:1px solid #ffffff25;color:#fff;font-size:12px;border-radius:12px;font-weight:800}
nav.tabs button.active{background:var(--gold);border-color:var(--gold);color:#2a1b12}

main{padding:14px 15px 26px}
button{font-family:inherit;cursor:pointer}
.btn{width:100%;border:2px solid #e0d3c1;background:#fff;border-radius:13px;padding:12px 8px;font-size:14px;font-weight:800;color:#60411d;box-shadow:0 2px 0 #d4c2ac}
.btn.primary{background:linear-gradient(135deg,var(--gold),var(--orange));border:0;color:#fff;font-size:16px;box-shadow:0 4px 0 #a64d08;padding:14px}
.btn.primary:disabled{opacity:.5;box-shadow:none;filter:grayscale(.3)}
.btn.ghost{background:transparent;border:2px solid #e0d3c1;color:#60411d;box-shadow:none}

.hero{background:#ffefad;border-radius:17px;padding:18px;text-align:center;margin-bottom:12px}
.hero h1{margin:6px 0 4px;font-size:22px}
.hero p{margin:0;font-size:13.5px;line-height:1.4;color:#6b584b}
.hero small{font-weight:900;letter-spacing:1.2px;color:#8c5b16;font-size:11px}

.card{background:#fff;border-radius:17px;padding:15px;margin:11px 0;box-shadow:0 2px 8px #00000010}

/* ---- combine screen ---- */
.roundline{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:#8b765e;margin-bottom:8px}
.combine{position:relative;background:#2f2016;border-radius:18px;min-height:132px;padding:14px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.combine.haspick{background:#3a2717}
.combineEmpty{color:#e8d3b6;text-align:center;font-size:13px;opacity:.85}
.combineEmpty span{display:block;font-size:26px;margin-bottom:4px}
.pick{background:#fff2d2;border-radius:14px;padding:8px 10px;text-align:center;font-weight:800;font-size:12px;color:#5b3c17;position:relative;min-width:56px;cursor:pointer;border:2px solid #ffd98a;transition:.15s}
.pick:active{transform:scale(.94)}
.pick .emoji{display:block;font-size:24px;margin-bottom:2px}
.pick .x{position:absolute;top:-6px;right:-6px;background:#3a2717;color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:900}
.pickhint{text-align:center;font-size:11px;color:#c9ac86;margin-top:6px}

.shelfLabel{font-size:11px;font-weight:900;letter-spacing:1px;color:#8b765e;margin:14px 0 8px}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ing{background:#fff;border:2px solid #e2d2bd;border-radius:14px;padding:12px 4px;text-align:center;font-weight:800;font-size:12px;color:#5a3c1b;min-width:0;width:100%;white-space:normal}
.ingName{display:block;width:100%;min-width:0;line-height:1.15;white-space:normal;overflow-wrap:anywhere;hyphens:auto}
.ing .emoji{display:block;font-size:26px;margin-bottom:4px}
.ing.locked{opacity:.4;filter:grayscale(1);background:#efe6d6}

.feedback{padding:12px;border-radius:14px;text-align:center;background:#efebe5;line-height:1.4;margin-top:10px;font-size:13.5px}
.feedback.good{background:var(--green)}
.feedback.bad{background:var(--red)}

.actiongrid,.toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}
.choice{background:#fff;border:2px solid #e2d2bd;border-radius:15px;padding:16px 6px;text-align:center;font-weight:800;color:#5a3c1b;min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.choice .big{font-size:28px}
.choice.wrong{background:#ffe1dc;border-color:#c85a49}
.choice.active{background:#ffe49a;border-color:#ed9a10;box-shadow:0 0 0 3px #f5a01955}
.toolSvg{width:44px;height:44px}

/* ---- do-phase mechanics ---- */
.doZone{background:#2f2016;border-radius:18px;padding:22px 14px;text-align:center;margin:12px 0;position:relative;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;user-select:none}
.doZone .doIcon{font-size:46px;transition:transform .05s linear}
.doLabel{color:#f3e3c8;font-size:13px;margin-top:10px;font-weight:700}
.doBarWrap{position:relative;width:100%;height:12px;background:#ffffff22;border-radius:8px;margin-top:14px;overflow:hidden}
.doBar{position:relative;z-index:1;height:100%;background:linear-gradient(90deg,#ffc94f,#ff8e0a);width:0%;transition:width .05s linear}
.doBar.burnzone{background:linear-gradient(90deg,#ffc94f,#e03b1f)}
.doGoodBand{position:absolute;z-index:2;left:0;right:0;top:50%;height:0}
.doGoodBand i{position:absolute;top:-14px;height:18px;background:#39cf7890;border:1px solid #7bffb5;border-radius:4px;box-shadow:0 0 8px #39cf78}
.tapcount{font-size:22px;font-weight:900;color:#ffc94f;margin-top:8px}

/* ---- discovery card ---- */
.discover{background:#fff0b8;border-radius:18px;padding:22px;text-align:center;margin-top:6px}
.discover .bowl{font-size:46px}
.discover h2{margin:8px 0 4px;font-size:19px}
.discover p{margin:0;font-size:13px;color:#6b584b;line-height:1.4}
.discover .fresh{display:inline-block;margin-top:8px;background:#ff9d12;color:#fff;border-radius:999px;padding:5px 12px;font-size:11px;font-weight:900}

/* ---- celebration ---- */
.celebrate{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center}
.celebrateCard{position:relative;z-index:2;background:#fff;border-radius:20px;padding:26px 20px;text-align:center;box-shadow:0 10px 30px #0003;max-width:340px}
.celebrateCard .trophy{font-size:44px}
.celebrateCard h2{margin:6px 0}
.celebrateCard .rank{display:inline-block;margin-top:4px}
.unlock{background:#fff4d7;border:2px solid #f1bf5c;border-radius:16px;padding:14px;margin:14px 0;font-weight:800}
.unlock span{font-size:36px;display:block;margin:4px 0}
.fall{position:absolute;top:-10%;font-size:22px;animation:fall linear infinite;opacity:.9}
@keyframes fall{
  0%{transform:translateY(-10vh) rotate(0);opacity:.9}
  90%{opacity:.9}
  100%{transform:translateY(115vh) rotate(300deg);opacity:0}
}

/* ---- book & badges ---- */
.tierBlock{margin-bottom:14px}
.tierHead{display:flex;align-items:center;gap:8px;font-weight:900;font-size:13px;color:#6b4a22;margin-bottom:8px}
.tierHead .em{font-size:20px}
.recipeRow{background:#fff;border-radius:13px;padding:10px 12px;display:flex;align-items:center;gap:10px;margin-bottom:6px;box-shadow:0 1px 4px #0000000d}
.recipeRow .em{font-size:22px;width:28px;text-align:center}
.recipeRow b{font-size:13px;display:block}
.recipeRow small{color:#8b765e;font-size:11px}
.recipeRow.locked{opacity:.55}

.badgeGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{background:#fff;border-radius:15px;padding:14px 10px;text-align:center;box-shadow:0 2px 8px #00000010}
.badge .em{font-size:30px;display:block;margin-bottom:6px}
.badge b{font-size:12.5px;display:block}
.badge small{font-size:12px;color:#8b765e}
.badge.locked{opacity:.38;filter:grayscale(.6)}

.center{text-align:center}
.muted{color:#786b5d;font-size:12.5px}
.hidden{display:none!important}
.tipbtn{position:relative}
.panicCard{max-width:680px;margin:12px auto;text-align:center}
.panicCanvas{display:block;width:100%;height:min(64vh,620px);min-height:390px;aspect-ratio:4/5;border-radius:18px;background:#2b1a11;touch-action:none;box-shadow:inset 0 0 0 3px #ffffff18}
.panicInfo{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:900;color:#65451f;margin:6px 0 10px}
.panicPill{background:#fff0cf;border:1px solid #e9d3a7;border-radius:999px;padding:8px 12px}
.panicInfo{justify-content:center}
.panicSignal{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;gap:10px;width:min(250px,90%);min-height:76px;margin:5px auto 13px;padding:10px 20px;border:4px solid #fff8e8;border-radius:20px;background:radial-gradient(circle at 50% 40%,#fff9 0 3%,var(--signal) 28%,#38251b 130%);color:#fff;font-size:20px;font-weight:1000;letter-spacing:1px;text-shadow:0 2px 3px #0008;box-shadow:0 0 14px 4px var(--signal),0 0 32px 12px var(--signal);animation:signalFlash .75s ease-in-out infinite alternate}
.panicSignal::before{content:"";position:absolute;inset:-12px;border:3px solid var(--signal);border-radius:25px;opacity:.55;z-index:-1;animation:signalWave 1.1s ease-out infinite}
.panicSignal .signalFruit{font-size:34px}
@keyframes signalFlash{from{filter:brightness(.82);transform:scale(.98)}to{filter:brightness(1.25);transform:scale(1.025)}}
@keyframes signalWave{from{transform:scale(.94);opacity:.65}to{transform:scale(1.14);opacity:0}}
.panicKeys{font-weight:900;color:#694822}
.linkGame{max-width:720px;margin:8px auto;text-align:center}
.linkBoard{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;max-width:570px;margin:12px auto;padding:10px;background:linear-gradient(135deg,#345d3e,#21432c);border-radius:18px;touch-action:manipulation}
.linkTile{min-width:0;aspect-ratio:1;background:linear-gradient(160deg,#fff,#fff4d8);border:2px solid #e4d5bf;border-radius:13px;padding:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#4e3924;box-shadow:0 2px 0 #bdb09a;transition:transform .16s,opacity .16s,background .16s,border-color .16s}
.linkTile:active{transform:scale(.91)}
.linkTile .produce{font-size:clamp(22px,5vw,34px);line-height:1.05}
.linkTile .produceName{font-size:clamp(8px,1.6vw,11px);font-weight:800;line-height:1.05;overflow-wrap:anywhere}
.linkTile.selected{background:#ffdf83;border-color:#ef9b23;transform:scale(.94);box-shadow:0 0 0 3px #f5a01955}
.linkTile.clearing{animation:linkPop .24s ease-in forwards}
.linkTile.invalid{background:#f8b4a7;border-color:#cd5245;animation:linkShake .2s linear 2}
.linkTile.special{background:linear-gradient(145deg,#ffeaa0,#f4aa3b);border-color:#d98218;box-shadow:0 0 0 2px #ffcf4d66,0 2px 0 #bd741c}
.linkTile.dropping{animation:linkDrop .42s cubic-bezier(.2,.8,.2,1)}
@keyframes linkDrop{from{transform:translateY(-55px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes linkPop{to{transform:scale(.1) rotate(20deg);opacity:0}}
@keyframes linkShake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.linkStats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-weight:900;color:#65451f}
.linkStat{background:#fff0cf;border:1px solid #e9d3a7;border-radius:999px;padding:8px 12px}
.linkLevels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.linkLevel{min-height:105px;padding:10px 5px;font-size:12px}
@media(max-width:420px){.linkBoard{gap:4px;padding:7px}.linkTile{border-radius:9px;padding:2px}.linkLevels{grid-template-columns:1fr}}
@media(max-width:699px){.panicCanvas{height:58vh;min-height:360px}}

/* ---- tablet and desktop layouts ---- */
.labWorkspace{display:block}
.pairingGrid{display:block}
.knowledgeCards{display:block}
@media (min-width:700px){
  .app{max-width:1100px}
  header{padding:24px 34px 18px}
  .brand{font-size:32px}
  .tag{font-size:12px}
  .stats{gap:10px;margin-top:16px}
  .pill{font-size:14px;padding:8px 13px}
  nav.tabs{grid-template-columns:repeat(6,1fr);padding:12px 28px;gap:10px}
  nav.tabs button{font-size:14px;padding:12px 8px}
  main{max-width:1060px;margin:0 auto;padding:24px 32px 42px}
  .hero{padding:25px;margin-bottom:18px}
  .hero h1{font-size:28px}
  .hero p{font-size:16px;max-width:760px;margin-left:auto;margin-right:auto}
  .card{padding:20px;margin:15px 0}
  .roundline{font-size:14px;margin-bottom:12px}
  .labWorkspace{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:22px;align-items:start}
  .labBench,.labPantry{background:#fff;border-radius:18px;padding:18px;box-shadow:0 2px 8px #00000010}
  .combine{min-height:230px;padding:22px}
  .pick .emoji{font-size:30px}
  .shelf{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .ing{font-size:13px;padding:15px 6px;min-height:92px}
  .ing .emoji{font-size:30px}
  .actiongrid,.toolgrid{gap:12px;margin:16px 0}
  .choice{font-size:15px;min-height:100px;padding:18px 10px}
  .choice .big{font-size:34px}
  .pairingGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
  .knowledgeCards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .knowledgeCards .card{margin:0;min-height:145px}
  .recipeRow{padding:14px 16px}
  .badgeGrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .feedback{font-size:15px}
}
@media (min-width:1000px){
  main{padding-left:40px;padding-right:40px}
  .labWorkspace{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px}
  .shelf{grid-template-columns:repeat(4,minmax(0,1fr))}
  .ing{font-size:13px}
  .knowledgeCards{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
  .badgeGrid{grid-template-columns:repeat(4,minmax(0,1fr))}
}

</style>
</head>

<script>
"use strict";

/* ==========================================================
   0) VERTAALHULP
   Elk vertaalbaar stukje tekst is een object {nl:'...', en:'...'}.
   tr(obj) geeft de tekst in de huidige taal (S.lang), met NL als
   terugval. t(key, vars) doet hetzelfde voor UI-strings met
   eenvoudige {naam}-interpolatie.
   ========================================================== */
function tr(obj){
  if(obj==null) return '';
  if(typeof obj==='string') return obj;
  return obj[S.lang] || obj.nl || '';
}
function t(key, vars){
  let s = tr(UI[key]);
  if(vars) Object.keys(vars).forEach(k=>{ s = s.split('{'+k+'}').join(vars[k]); });
  return s;
}

/* ==========================================================
   1) DATA — alle ingrediënten, rondes en recepten op één plek.
      Nieuwe ronde toevoegen = hier één object toevoegen, verder
      hoeft er niets aangepast te worden.
   ========================================================== */

const TIERS = [
  { unlock:null, recipes:[
    {ids:['oil','vinegar'], product:{nl:'Vinaigrette',en:'Vinaigrette'}, emoji:'🥗', act:'whisk', category:{nl:'Dressing',en:'Dressing'},
     story:{nl:'Een klassieke koude emulsie van olie en azijn. Mosterd kan helpen binden, maar hoort niet verplicht in elke basisvinaigrette.',en:'A classic cold emulsion of oil and vinegar. Mustard can help bind it, but is not required in every basic vinaigrette.'},
     lesson:{nl:{amount:'3 el olie · 1 el wijnazijn · zout en peper naar smaak',tools:'Mengkom, garde, maatlepel',steps:['Doe azijn met zout en peper in de kom.','Klop de olie er geleidelijk door tot de dressing tijdelijk gebonden is.','Proef en stel zuur, zout en olie bij.'],sign:'De dressing glanst en is kort gebonden; olie en azijn kunnen later weer scheiden.',fix:'Te zuur? Klop er wat olie bij. Een beetje mosterd kan helpen de emulsie te stabiliseren.',source:'https://www.cordonbleu.edu/news/what-are-the-mother-sauces-of-french-cooking/en',sourceName:'Le Cordon Bleu — sauzen'},en:{amount:'3 tbsp oil · 1 tbsp wine vinegar · salt and pepper to taste',tools:'Mixing bowl, whisk, measuring spoon',steps:['Put the vinegar, salt and pepper in the bowl.','Whisk in the oil gradually until the dressing is temporarily emulsified.','Taste and adjust acid, salt and oil.'],sign:'The dressing looks glossy and briefly emulsified; oil and vinegar may separate later.',fix:'Too sharp? Whisk in a little more oil. A little mustard can help stabilize the emulsion.',source:'https://www.cordonbleu.edu/news/what-are-the-mother-sauces-of-french-cooking/en',sourceName:'Le Cordon Bleu — sauces'}}}
    ,{ids:['oil','vinegar','mustard','honey'],product:{nl:'Honing-mosterdressing',en:'Honey-mustard dressing'},emoji:'🍯',act:'whisk',category:{nl:'Dressing',en:'Dressing'},story:{nl:'Een veelgebruikte zoet-pittige vinaigrette: mosterd en honing worden met azijn en olie tot dressing geklopt.',en:'A common sweet-tangy vinaigrette: mustard and honey are whisked with vinegar and oil into a dressing.'},lesson:{nl:{amount:'3 el olijfolie · 1 el azijn · 1 tl mosterd · 1 tl honing · zout en peper',tools:'Mengkom, garde, maatlepels',steps:['Klop azijn, mosterd, honing, zout en peper glad.','Klop de olie er geleidelijk door tot de dressing gebonden is.','Proef en pas zoet en zuur naar wens aan.'],sign:'Glad, glanzend en zoetzuur; de dressing bedekt licht de blaadjes.',fix:'Te zoet? Voeg beetje bij beetje azijn toe. Te zuur? Voeg wat olie of honing toe.',source:'https://www.cordonbleu.edu/paris/2-day-cuisine-workshop-sauces-and-jus/en',sourceName:'Le Cordon Bleu — vinaigrettes'},en:{amount:'3 tbsp olive oil · 1 tbsp vinegar · 1 tsp mustard · 1 tsp honey · salt and pepper',tools:'Mixing bowl, whisk, measuring spoons',steps:['Whisk vinegar, mustard, honey, salt and pepper until smooth.','Gradually whisk in oil until emulsified.','Taste and adjust sweetness and acidity.'],sign:'Smooth, glossy and sweet-tangy; lightly coats salad leaves.',fix:'Too sweet? Add vinegar gradually. Too sharp? Add a little oil or honey.',source:'https://www.cordonbleu.edu/paris/2-day-cuisine-workshop-sauces-and-jus/en',sourceName:'Le Cordon Bleu — vinaigrettes'}}}
  ]},
  { unlock:{id:'egg',icon:'🥚',name:{nl:'Ei',en:'Egg'}}, recipes:[
    {ids:['egg','oil','vinegar'],product:{nl:'Mayonaise',en:'Mayonnaise'},emoji:'🥣',act:'whisk',
     story:{nl:'Eidooier en olie vormen al kloppend een koude emulsie; azijn geeft zuur. Mosterd is een mogelijke toevoeging, geen vereiste.',en:'Egg yolk and oil form a cold emulsion as they are whisked; vinegar adds acidity. Mustard is optional, not essential.'},
     lesson:{nl:{amount:'2 eidooiers · 500 ml neutrale olie · 40 ml wittewijnazijn · snuf zout',tools:'Diepe kom, garde, maatbeker',steps:['Breng ingrediënten op kamertemperatuur; scheid de dooiers.','Klop de dooiers met azijn en zout.','Voeg olie druppel voor druppel toe terwijl je voortdurend klopt.','Als de emulsie dikker wordt, giet je de olie in een dunne straal erbij.'],sign:'De saus wordt dik, licht van kleur en egaal; olie glanst niet los bovenop.',fix:'Geschift? Begin in een schone kom met een theelepel warm water of azijn en klop de geschifte saus er druppelsgewijs door. Werk schoon en koel; gebruik gepasteuriseerde dooier als rauw ei niet geschikt is.',source:'https://www.cordonbleu.edu/news/technique-video-how-to-prepare-mayonnaise/en',sourceName:'Le Cordon Bleu — mayonnaise techniek'},en:{amount:'2 egg yolks · 500 ml neutral oil · 40 ml white wine vinegar · pinch of salt',tools:'Deep bowl, whisk, measuring jug',steps:['Bring ingredients to room temperature; separate the yolks.','Whisk yolks with vinegar and salt.','Add oil drop by drop while whisking continuously.','Once the emulsion thickens, add the oil in a thin steady stream.'],sign:'The sauce becomes thick, pale and even; no oil shines separately on top.',fix:'Split? Start in a clean bowl with a teaspoon of warm water or vinegar and whisk in the split sauce drop by drop. Keep equipment clean and chilled; use pasteurized yolk when raw egg is unsuitable.',source:'https://www.cordonbleu.edu/news/technique-video-how-to-prepare-mayonnaise/en',sourceName:'Le Cordon Bleu — mayonnaise technique'}}}
  ]},
  { unlock:{id:'garlic',icon:'🧄',name:{nl:'Knoflook',en:'Garlic'}}, recipes:[

     story:{nl:'Een gangbare moderne aïoli is mayonaise op smaak gebracht met knoflook. Traditionele Provençaalse aïoli wordt met knoflook en olie in een vijzel gemaakt; dit spel leert de moderne emulsieversie.',en:'A common modern aioli is mayonnaise flavored with garlic. Traditional Provençal aioli is made with garlic and oil in a mortar; this game teaches the modern emulsion version.'},
     lesson:{nl:{amount:'1 eidooier · 1 kleine teen knoflook · 150 ml neutrale of milde olijfolie · 1 tl azijn · zout',tools:'Vijzel of rasp voor knoflook, kom, garde',steps:['Wrijf of rasp de knoflook fijn.','Klop met eidooier, azijn en zout.','Klop de olie eerst druppelsgewijs en daarna in een dun straaltje erdoor.','Proef; laat kort gekoeld rusten zodat de knoflooksmaak zich verdeelt.'],sign:'Lichtgele, dikke en gladde emulsie met duidelijke maar niet scherpe knoflooksmaak.',fix:'Als de saus breekt: opnieuw emulgeren in een schone kom met een klein scheutje water. Rauwe-ei aandacht geldt ook hier.',source:'https://www.cordonbleu.edu/news/technique-video-how-to-prepare-mayonnaise/en',sourceName:'Le Cordon Bleu — mayonnaise en afgeleide sauzen'},en:{amount:'1 egg yolk · 1 small garlic clove · 150 ml neutral or mild olive oil · 1 tsp vinegar · salt',tools:'Mortar or grater for garlic, bowl, whisk',steps:['Crush or grate the garlic finely.','Whisk with egg yolk, vinegar and salt.','Whisk in oil drop by drop, then in a thin stream.','Taste; chill briefly so the garlic flavor spreads.'],sign:'Pale yellow, thick and smooth emulsion with clear but not harsh garlic flavor.',fix:'If it splits, emulsify again in a clean bowl with a small splash of water. Raw-egg handling applies here too.',source:'https://www.cordonbleu.edu/news/technique-video-how-to-prepare-mayonnaise/en',sourceName:'Le Cordon Bleu — mayonnaise and derivative sauces'}}}

     lesson:{nl:{amount:'3 eidooiers · 225 g boter, gesmolten en warm · 1½ el citroensap · 1 el water · zout',tools:'Kleine pan, hittebestendige kom, garde, pollepel, doek',steps:['Smelt de boter en houd warm. Zet een kom boven zacht pruttelend water; de kom mag het water niet raken.','Klop dooiers met water au bain-marie tot bleek, dik en lintvormig.','Haal van de warmtebron. Klop de warme boter er eerst druppelsgewijs en daarna in dunne straal door.','Breng op smaak met citroen en zout; serveer direct.'],sign:'Glad, luchtig en napperend; de garde laat kort zichtbare sporen achter. Houd warm, nooit heet.',fix:'Te dik? Klop er een theelepel warm water of citroen door. Dreigt de dooier te stollen, haal de kom direct van de pan.',source:'https://www.ciafoodies.com/hollandaise-sauce/',sourceName:'The Culinary Institute of America — Hollandaise'},en:{amount:'3 egg yolks · 225 g butter, melted and warm · 1½ tbsp lemon juice · 1 tbsp water · salt',tools:'Small pan, heatproof bowl, whisk, ladle, towel',steps:['Melt butter and keep warm. Set a bowl over gently simmering water; bowl must not touch water.','Whisk yolks with water over the bain-marie until pale, thick and ribboning.','Remove from heat. Whisk in warm butter drop by drop, then in a thin stream.','Season with lemon and salt; serve promptly.'],sign:'Smooth, airy and coats the back of a spoon; whisk marks briefly remain. Keep warm, never hot.',fix:'Too thick? Whisk in a teaspoon of warm water or lemon. If yolks begin to set, take the bowl off the pan immediately.',source:'https://www.ciafoodies.com/hollandaise-sauce/',sourceName:'The Culinary Institute of America — Hollandaise'}}}

     story:{nl:'Een eenvoudige Italiaanse stijl tomatensaus bouwt smaak op met olijfolie, knoflook en tomaat, en laat de tomaat rustig inkoken.',en:'A simple Italian-style tomato sauce builds flavor with olive oil, garlic and tomato, simmering until concentrated.'},
     lesson:{nl:{amount:'400 g rijpe tomaten of tomaten uit blik · 1 el olijfolie · 1 teen knoflook · zout; basilicum optioneel',tools:'Snijplank, mes, steelpan, houten lepel',steps:['Snijd of plet de tomaten; hak de knoflook fijn.','Verwarm olie zacht in de pan en laat knoflook geuren zonder te kleuren.','Voeg tomaat en zout toe. Laat zachtjes pruttelen tot de saus indikt; roer af en toe.','Proef en werk eventueel af met basilicum.'],sign:'De saus is geconcentreerd en lepelbaar; olie is niet verbrand en de tomaat smaakt rond.',fix:'Te zuur? Laat verder inkoken en proef opnieuw; voeg niet automatisch suiker toe. Verbrande knoflook geeft bitterheid: begin opnieuw.',source:'https://www.cordonbleu.edu/news/what-are-the-mother-sauces-of-french-cooking/en',sourceName:'Le Cordon Bleu — tomatensaus'},en:{amount:'400 g ripe or canned tomatoes · 1 tbsp olive oil · 1 garlic clove · salt; basil optional',tools:'Board, knife, saucepan, wooden spoon',steps:['Chop or crush tomatoes; finely chop garlic.','Warm oil gently and let garlic become fragrant without browning.','Add tomato and salt. Simmer gently until thickened, stirring now and then.','Taste and finish with basil if desired.'],sign:'Concentrated and spoonable; oil is not burnt and tomato flavor tastes rounded.',fix:'Too sharp? Simmer longer and taste again; do not automatically add sugar. Burnt garlic tastes bitter, so start again.',source:'https://www.cordonbleu.edu/news/what-are-the-mother-sauces-of-french-cooking/en',sourceName:'Le Cordon Bleu — tomato sauce'}}}

     story:{nl:'Roux is een klassieke bindbasis van gelijke gewichten vet en bloem. De witte roux gaart kort zonder te kleuren en vormt de basis voor béchamel.',en:'Roux is a classic thickening base of equal weights fat and flour. White roux cooks briefly without browning and forms the base for béchamel.'},

/* Elk recept krijgt een stabiele, taal-onafhankelijke id (gebaseerd op de
   ingrediënten), zodat ontdekte recepten herkenbaar blijven ongeacht de

let S = freshState();
S.msg = t('chooseIngredients');

function serialize(){
  return JSON.stringify({...S, products:[...S.products], dataVersion:currentDataVersion()});
}
function loadRaw(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    // Vul velden aan die in nieuwere spelversies zijn toegevoegd.
    // Zo blijven oudere saves bruikbaar wanneer er een nieuwe spelmodus bijkomt.
    const defaults = freshState();
    for(const [key,value] of Object.entries(defaults)){
      if(d[key]===undefined) d[key]=value;
    }
    d.tasteRatings = {...defaults.tasteRatings, ...(d.tasteRatings||{})};
    d.tasteRatingsBySample = d.tasteRatingsBySample || {};
    if(d.tasteSample && d.tasteRatings && !d.tasteRatingsBySample[d.tasteSample]) d.tasteRatingsBySample[d.tasteSample] = d.tasteRatings;
    if(!['detective','balance','tasting'].includes(d.tasteMode)) d.tasteMode='detective';
    const knownIds = new Set(TIERS.flatMap(t=>t.recipes).map(r=>r.id));
    d.products = new Set((d.products||[]).filter(id=>knownIds.has(id)));
    if(!d.lang) d.lang='nl';
    d.learning=!!d.learning;
    d.lessonOpen=false;
    d.tierIndex=0;
    // Eén nieuwe bereiding uit een ronde ontgrendelt de volgende stap.
    // Zo blokkeren bonusrecepten de voortgang niet; bestaande saves tellen mee.
    for(let i=0;i<TIERS.length-1;i++){
      if(TIERS[i].recipes.some(r=>d.products.has(r.id))) d.tierIndex=i+1;
      else break;
    }
    if(d.phase==='foodrushLink') d.phase='home';
    if(d.phase==='celebrate'||d.phase==='action'||d.phase==='tool'||d.phase==='do'||d.phase==='spices'||d.phase==='discover'){
      d.phase='ingredients'; d.pick=[]; d.current=null;
    }
    return d;
  }catch(e){ return null; }
}
function save(){ try{ localStorage.setItem(SAVE_KEY, serialize()); }catch(e){} }
function hasSave(){ return loadRaw()!==null; }
function load(){ const d=loadRaw(); S = d || freshState(); }

/* ==========================================================
   2b) GELUID — gesynthetiseerd met de Web Audio API, geen
       externe bestanden nodig. Alles faalt stil als de
       browser geen AudioContext ondersteunt.
   ========================================================== */
let audioCtx = null;
function getAudioCtx(){
  if(S.muted) return null;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    return audioCtx;
  }catch(e){ return null; }
}
function tone(freq, start, dur, type, gain){
  const ctx = getAudioCtx(); if(!ctx) return;
  const osc = ctx.createOscillator(); const g = ctx.createGain();
  osc.type = type||'sine'; osc.frequency.value = freq;
  osc.connect(g); g.connect(ctx.destination);
  const t0 = ctx.currentTime + start;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain||0.15, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function sndClick(){ tone(520,0,0.08,'sine',0.06); }
function sndSuccess(){ tone(523,0,0.14,'sine',0.12); tone(659,0.08,0.16,'sine',0.12); tone(784,0.16,0.22,'sine',0.14); }
function sndSignature(){ tone(523,0,0.12,'triangle',0.12); tone(659,0.1,0.12,'triangle',0.12); tone(784,0.2,0.12,'triangle',0.12); tone(1047,0.3,0.3,'triangle',0.16); }
function sndFail(){ tone(300,0,0.12,'sawtooth',0.08); tone(220,0.1,0.2,'sawtooth',0.08); }
function sndFanfare(){
  const notes=[523,659,784,1047,784,1047];
  notes.forEach((f,i)=> tone(f, i*0.13, 0.22, 'triangle', 0.14));
}

function availableIngredients(){
  const list=[...START_INGREDIENTS];
  for(let i=0;i<S.tierIndex;i++){ if(TIERS[i+1] && TIERS[i+1].unlock) list.push(TIERS[i+1].unlock); }
  for(const r of TIERS.flatMap(t=>t.recipes)) if(r.outputIngredient && S.products.has(r.id)) list.push(r.outputIngredient);
  return list;
}
function visibleRecipes(){
  let list=[];
  for(let i=0;i<=S.tierIndex;i++) list = list.concat(TIERS[i].recipes);
  return list;
}
function findExactRecipe(ids){
  const key=[...ids].sort().join('|');
  return visibleRecipes().find(r=>[...r.ids].sort().join('|')===key) || null;
}
function findPartialRecipe(ids){
  // Zoekt een recept waar de huidige keuze een deel van is (maar nog niet compleet) —
  // gebruikt om een bemoedigende hint te geven in plaats van "fout".
  return visibleRecipes().find(r=>r.ids.length>ids.length && ids.every(id=>r.ids.includes(id))) || null;
}
function rank(){
  let cur=RANKS[0];
  for(const r of RANKS){ if(S.products.size>=r.min) cur=r; }
  return tr(cur.name);
}
function maxPick(){ return 6; }

/* Een mislukte poging: ingrediënten kwijt, streak weg, terug naar start.
   Dit maakt fouten echt kostbaar in plaats van gratis herkansen. */
function failAttempt(msg){
  S.streak=0;
  S.pick=[]; S.current=null; S.phase='ingredients';
  S.msg=msg; S.msgType='bad';
  S.mistakesThisAttempt=0;
  sndFail();
  save();
  render();
}

function selectIngredient(id){
  const e = availableIngredients().find(x=>x.id===id);
  if(!e) return;
  const ix = S.pick.findIndex(x=>x.id===id);
  if(ix>=0){ S.pick.splice(ix,1); S.msg=t('chooseIngredients'); S.msgType=''; render(); return; }
  if(S.pick.length>=maxPick()) S.pick.shift();
  S.pick.push(e);
  S.msg = S.pick.length===1 ? t('chooseOneMore') : t('readyPrepare');
  S.msgType='';
  render();
}
function removePick(idx){
  S.pick.splice(idx,1);
  S.msg = S.pick.length ? t('adjustOrPrepare') : t('chooseIngredients');
  render();
}
function prepare(){
  if(S.pick.length<2){ S.msg=t('chooseIngredientsFirst'); S.msgType='bad'; render(); return; }
  const ids = S.pick.map(x=>x.id);
  const r = findExactRecipe(ids);
  if(!r){
    const partial = findPartialRecipe(ids);
    if(partial){
      const missing = partial.ids.length - ids.length;
      const unit = missing===1 ? t('ingredientSingular') : t('ingredientPlural');
      S.msg = t('partialHint', {n: missing+' '+unit});
      S.msgType=''; render();
      return;
    }
    S.msg=t('noKnownCombo'); S.msgType='bad'; render();
    setTimeout(()=>{ S.pick=[]; S.msg=t('tryAgainMsg'); S.msgType=''; render(); }, 1000);
    return;
  }
  S.current=r; S.spicePick=[]; S.phase='spices'; S.msg=''; S.msgType='';
  S.mistakesThisAttempt=0;
  render();
}
function chooseAction(a){
  if(a!==S.current.act){
    S.mistakesThisAttempt++;
    if(S.mistakesThisAttempt>=2){
      failAttempt(t('failedAttempt'));
      return;
    }
    S.streak=0;
    const why={whisk:{nl:'Kloppen bindt de ingrediënten geleidelijk tot een emulsie.',en:'Whisking gradually binds the ingredients into an emulsion.'},stir:{nl:'Rustig roeren mengt de ingrediënten zonder extra lucht in te slaan.',en:'Gentle stirring combines ingredients without adding extra air.'},heat:{nl:'Verwarmen laat smaken ontwikkelen of een saus binden; let goed op de temperatuur.',en:'Heating develops flavor or thickens a sauce; watch the temperature.'},mix:{nl:'Mixen of stampen verdeelt vaste ingrediënten fijn door de saus.',en:'Blending or pounding breaks solid ingredients down into the sauce.'}}[S.current.act];
    const actLabel=tr(UI[{whisk:'actWhisk',stir:'actStir',heat:'actHeat',mix:'actMix'}[S.current.act]]);
    const explanation=S.lang==='nl'?`De juiste handeling is ${actLabel}: ${tr(why)}`:`The right action is ${actLabel}: ${tr(why)}`;
    S.msg=t('actionWrong',{why:explanation}); S.msgType='bad'; render();
    return;
  }
  S.phase='do'; S.msg=t('actionGood'); S.msgType='good'; S.doStart=performance.now(); render();
}

};
function spiceChoices(r){
  const name=(r.product?.nl||'').toLowerCase();
  let right=SPICE_RECIPE_MAP[r.id];
  if(name.includes('vinaigrette')) right=['pepper','chervil'];
  else if(name.includes('honing-mosterd')) right=['pepper','dill'];
  else if(name.includes('mayonaise')) right=['whitePepper','mustardPowder'];
  else if(name.includes('aïoli')) right=['parsley','pepper'];
  else if(name.includes('witte roux')) right=['pepper'];
  else if(name.includes('hollandaise')) right=['whitePepper','cayenne'];
  else if(name.includes('tomatensaus')) right=['basil','oregano'];
  else if(name.includes('béchamel')) right=['nutmeg','whitePepper'];
  else if(name.includes('mornay')) right=['nutmeg','whitePepper'];
  else if(name.includes('cacık')) right=['dill','mint'];
  else if(name.includes('soubise')) right=['thyme','whitePepper'];
  else if(name.includes('arrabbiata')) right=['chili','oregano'];
  else if(name.includes('pesto')) right=['basil','pepper'];
  else if(name.includes('béarnaise')) right=['tarragon','whitePepper','chervil'];
  if(!right) right=['pepper'];
  const pool=Object.keys(SPICE_BANK).filter(id=>!right.includes(id));
  const wrong=pool.slice((r.id.length*3)%Math.max(1,pool.length)).concat(pool).slice(0,2);
  return [...right,...wrong].map(id=>({id,...SPICE_BANK[id],correct:right.includes(id)}));
}

function submitSpices(){
  const opts=spiceChoices(S.current), right=opts.filter(x=>x.correct).map(x=>x.id);

function completeDo(){

let gesture = {active:false,lastAngle:0,travel:0};
let holdRaf = null, holdVal=0, holdDir=1;
let tapCount = 0;

function bindDoMechanic(){
  const act = S.current.act;
  if(act==='whisk' || act==='stir') bindGesture(act);
  else if(act==='heat') bindHold();
  else if(act==='mix') bindTap();
}
function bindGesture(act){
  const zone = document.getElementById('doZone');
  if(!zone) return;
  const required = act==='stir' ? Math.PI*13 : Math.PI*9;
  gesture = {active:false,lastAngle:0,travel:0};
  const angle=(p,r)=>Math.atan2(p.clientY-(r.top+r.height/2), p.clientX-(r.left+r.width/2));
  const start=e=>{
    e.preventDefault();
    const r=zone.getBoundingClientRect();
    const p=e.touches?e.touches[0]:e;
    gesture.active=true; gesture.lastAngle=angle(p,r);
  };
  const move=e=>{
    if(!gesture.active) return;
    e.preventDefault();
    const r=zone.getBoundingClientRect();
    const p=e.touches?e.touches[0]:e;
    const a=angle(p,r);
    let d=a-gesture.lastAngle;
    if(d>Math.PI) d-=Math.PI*2; if(d<-Math.PI) d+=Math.PI*2;
    gesture.travel+=Math.abs(d); gesture.lastAngle=a;
    const pct=Math.min(100,(gesture.travel/required)*100);
    const bar=document.getElementById('doBar'); if(bar) bar.style.width=pct+'%';
    const icon=document.getElementById('doIcon'); if(icon) icon.style.transform=`rotate(${gesture.travel*57.2958}deg)`;
    if(pct>=100){ gesture.active=false; completeDo(); }
  };
  const end=()=>{ gesture.active=false; };
  zone.addEventListener('pointerdown',start); zone.addEventListener('pointermove',move);
  zone.addEventListener('pointerup',end); zone.addEventListener('pointercancel',end);
  zone.addEventListener('lostpointercapture',end);
}
function bindHold(){
  const zone=document.getElementById('doZone');
  if(!zone) return;
  let holding=false, startedAt=0, burnt=false;
  const GOOD_MIN=61, BURN_AT=100, BURN_MS=2000;
  const step=()=>{
    if(!holding) return;
    holdVal=Math.min(100,((performance.now()-startedAt)/BURN_MS)*100);
    const bar=document.getElementById('doBar');
    if(bar) bar.style.width=holdVal+'%';
    if(holdVal>=BURN_AT && !burnt){
      burnt=true; holding=false;
      holdVal=0;
      failAttempt(t('burnt'));
      return;
    }
    holdRaf=requestAnimationFrame(step);
  };
  const start=e=>{ e.preventDefault(); if(holding)return; holding=true; burnt=false; holdVal=0; startedAt=performance.now(); zone.setPointerCapture?.(e.pointerId); holdRaf=requestAnimationFrame(step); };
  const stop=e=>{
    e && e.preventDefault();
    if(!holding) return;
    holdVal=Math.min(100,((performance.now()-startedAt)/BURN_MS)*100);
    holding=false; cancelAnimationFrame(holdRaf);
    if(burnt) return;
    if(holdVal>=BURN_AT){ failAttempt(t('burnt')); return; }
    if(holdVal>=GOOD_MIN && holdVal<BURN_AT){ completeDo(); }
    else { S.msg=t('notWarmEnough'); S.msgType='bad'; holdVal=0; render(); }
  };
  zone.addEventListener('pointerdown',start); zone.addEventListener('pointerup',stop);
  zone.addEventListener('pointercancel',stop); zone.addEventListener('lostpointercapture',stop);
}
function bindTap(){
  tapCount=0;
  const NEEDED=12;
  const btn=document.getElementById('tapBtn');
  if(!btn) return;
  const onTap=e=>{
    e.preventDefault();
    tapCount++;
    const bar=document.getElementById('doBar'); if(bar) bar.style.width=Math.min(100,(tapCount/NEEDED)*100)+'%';
    const label=document.getElementById('tapCount'); if(label) label.textContent=tapCount+' / '+NEEDED;
    const icon=document.getElementById('doIcon'); if(icon){ icon.style.transform=`rotate(${tapCount*35}deg)`; }
    if(tapCount>=NEEDED) completeDo();
  };
  btn.addEventListener('pointerdown',onTap);
}

function translateOption(value){return S.lang==='en'?(OPTION_TRANSLATIONS[value]||value):value;}
function shuffleStable(key,items,idFn=x=>x.id){
  S.optionOrders=S.optionOrders||{}; const ids=items.map(idFn), old=S.optionOrders[key];
  if(!Array.isArray(old)||old.length!==ids.length||ids.some(id=>!old.includes(id))){
    const shuffled=[...ids]; for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}
    S.optionOrders[key]=shuffled; save();
  }
  return S.optionOrders[key].map(id=>items.find(x=>idFn(x)===id)).filter(Boolean);
}
function chooseKnowledgeTopic(topic){
  S.knowledgeTopic=topic; S.knowledgeQuizIndex=0; S.knowledgeAnswered=false; S.knowledgeChoice=''; S.msg=''; S.msgType=''; save(); render();
}
function chooseKnowledgeAnswer(choice){
  const list=KNOWLEDGE_QUIZZES[S.knowledgeTopic];
  const q=list[(S.knowledgeQuizIndex||0)%list.length];
  if(S.knowledgeAnswered) return;
  S.knowledgeChoice=choice; S.knowledgeAnswered=true;
  const right=choice===q.answer;
  if(right) S.knowledgeScore=(S.knowledgeScore||0)+1;
  const answerLabel=translateOption(q.answer);
  S.msg=right?(S.lang==='nl'?'Goed gedaan!':'Correct!'):(S.lang==='nl'?`Het juiste antwoord is: ${answerLabel}.`:`The correct answer is: ${answerLabel}.`);
  S.msgType=right?'good':'bad'; save(); render();
}
function nextKnowledgeQuiz(){
  const list=KNOWLEDGE_QUIZZES[S.knowledgeTopic];
  S.knowledgeQuizIndex=((S.knowledgeQuizIndex||0)+1)%list.length;
  S.knowledgeAnswered=false; S.knowledgeChoice=''; S.msg=''; S.msgType=''; save(); render();
}
function toggleMiseStep(index){
  const list=new Set(S.knowledgeDone||[]);
  list.has(index)?list.delete(index):list.add(index);
  S.knowledgeDone=[...list]; save(); render();
}

function currentTasteQuestion(){
  const list=S.tasteMode==='balance'?TASTE_BALANCE:TASTE_PROFILES;
  return list[(S.tasteIndex||0)%list.length];
}
function setTasteMode(mode){S.tasteMode=mode;S.tasteIndex=0;S.tastePicked=[];S.tasteAnswered=false;S.msg='';S.msgType='';save();render();}
function toggleTasteAnswer(id){if(S.tasteAnswered)return;S.tastePicked=S.tastePicked.includes(id)?S.tastePicked.filter(x=>x!==id):[...S.tastePicked,id];render();}
function checkTasteProfile(){
  const q=currentTasteQuestion(), right=new Set(q.right), picked=new Set(S.tastePicked);
  const ok=right.size===picked.size&&[...right].every(id=>picked.has(id));
  S.tasteAnswered=true; if(ok)S.tasteScore=(S.tasteScore||0)+1;
  S.msg=ok?(S.lang==='nl'?'Goed geproefd!':'Well tasted!'):(S.lang==='nl'?'Kijk naar de uitleg en probeer de volgende smaak.':'Check the explanation and try the next taste.');
  S.msgType=ok?'good':'bad'; save();render();
}
function answerTasteBalance(id){
  if(S.tasteAnswered)return;
  const q=currentTasteQuestion(),option=q.options.find(o=>o.id===id);
  S.tasteAnswered=true;S.tastePicked=[id];
  if(option?.ok)S.tasteScore=(S.tasteScore||0)+1;
  S.msg=option?.ok?(S.lang==='nl'?'Goed bijgestuurd!':'Good adjustment!'):(S.lang==='nl'?'Dat helpt hier niet. Bekijk de uitleg.':'That will not help here. Check the explanation.');
  S.msgType=option?.ok?'good':'bad';save();render();
}

function bindKitchenPanic(){
  const canvas=document.getElementById('panicCanvas'); if(!canvas||PANIC.mode!=='run')return;
  const ctx=canvas.getContext('2d'); let W=0,H=0,dpr=1;
  const resize=()=>{const r=canvas.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;if(!W||!H)return;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);};
  resize(); PANIC.panX=W/2; PANIC.keys.left=false;PANIC.keys.right=false;
  PANIC.keyDown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();PANIC.keys[e.key==='ArrowLeft'?'left':'right']=true;}};
  PANIC.keyUp=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();PANIC.keys[e.key==='ArrowLeft'?'left':'right']=false;}};
  window.addEventListener('keydown',PANIC.keyDown);window.addEventListener('keyup',PANIC.keyUp);
  const move=e=>{const r=canvas.getBoundingClientRect();PANIC.panX=Math.max(42,Math.min(W-42,e.clientX-r.left));};
  canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture?.(e.pointerId);move(e)});
  canvas.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e)});
  const draw=(now)=>{
    if(PANIC.mode!=='run')return;
    const rect=canvas.getBoundingClientRect(); if(rect.width!==W||rect.height!==H)resize();
    const dt=Math.min(45,now-PANIC.lastAt);PANIC.lastAt=now;
    const elapsed=now-PANIC.startedAt,remaining=Math.max(0,PANIC.duration-elapsed);
    if(remaining<=0){finishKitchenPanic();return;}
    if(now>=PANIC.nextTarget){let next=PANIC.target;while(next===PANIC.target)next=Math.floor(Math.random()*PANIC_COLORS.length);PANIC.target=next;PANIC.nextTarget=now+5000;const signal=document.getElementById('panicSignal');if(signal){signal.style.setProperty('--signal',PANIC_COLORS[next].hex);signal.setAttribute('aria-label',`${panicText('Vang deze kleur:','Catch this color:')} ${PANIC_COLORS[next][S.lang]}`);signal.innerHTML=`<span class="signalFruit">${PANIC_COLORS[next].fruit}</span><span>${PANIC_COLORS[next][S.lang]}</span>`;}}
    if(now>=PANIC.nextSpawn){
      const power=Math.random()<.13;
      if(power){const p=PANIC_POWERUPS[Math.floor(Math.random()*PANIC_POWERUPS.length)];PANIC.items.push({kind:'power',id:p.id,emoji:p.emoji,x:28+Math.random()*(W-56),y:-24,speed:150+Math.random()*50});}
      else {const c=PANIC_COLORS[Math.floor(Math.random()*PANIC_COLORS.length)];PANIC.items.push({kind:'fruit',color:c.id,emoji:c.fruit,x:24+Math.random()*(W-48),y:-24,speed:170+Math.random()*80+elapsed/500});}
      PANIC.nextSpawn=now+Math.max(260,640-elapsed/100);
    }
    const slow=now<PANIC.slowUntil?0.48:1;
    const panY=H-56,panW=now<PANIC.wideUntil?132:86,catchW=now<PANIC.magnetUntil?panW*1.6:panW;
    if(PANIC.keys.left!==PANIC.keys.right)PANIC.panX+=(PANIC.keys.right?1:-1)*420*dt/1000;
    PANIC.panX=Math.max(panW/2,Math.min(W-panW/2,PANIC.panX));
    for(const item of PANIC.items){item.y+=item.speed*slow*dt/1000;if(now<PANIC.magnetUntil&&item.kind==='fruit'&&item.color===PANIC_COLORS[PANIC.target].id&&item.y>H*.55)item.x+=(PANIC.panX-item.x)*Math.min(.08,dt/180);}
    for(let i=PANIC.items.length-1;i>=0;i--){const item=PANIC.items[i];if(item.y>=panY-18&&item.y<=panY+20&&Math.abs(item.x-PANIC.panX)<catchW/2){
        if(item.kind==='power'){if(item.id==='slow')PANIC.slowUntil=now+5500;else if(item.id==='wide')PANIC.wideUntil=now+7000;else PANIC.magnetUntil=now+6500;PANIC.score+=5;}
        else if(item.color===PANIC_COLORS[PANIC.target].id){PANIC.combo++;PANIC.score+=10+Math.min(PANIC.combo,10)*2;}else PANIC.combo=0;
        PANIC.items.splice(i,1);
      }else if(item.y>H+28)PANIC.items.splice(i,1);}
    ctx.clearRect(0,0,W,H);
    const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#3a2418');bg.addColorStop(1,'#21140e');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffffff0c';for(let y=38;y<H;y+=70){ctx.beginPath();ctx.arc((y*31)%W,y,18,0,Math.PI*2);ctx.fill();}
    ctx.textAlign='center';ctx.textBaseline='middle';
    for(const item of PANIC.items){ctx.font=item.kind==='power'?'34px system-ui':'32px system-ui';ctx.fillText(item.emoji,item.x,item.y);}
    ctx.fillStyle=now<PANIC.wideUntil?'#f4bf4a':'#ed8f34';ctx.fillRect(PANIC.panX-panW/2,panY,panW,25);ctx.fillStyle='#a95a21';ctx.fillRect(PANIC.panX-panW/2+8,panY+20,panW-16,5);
    const scoreEl=document.getElementById('panicScore');if(scoreEl)scoreEl.textContent=`⭐ ${PANIC.score}${PANIC.combo>1?' · 🔥 '+PANIC.combo:''}`;
    const timeEl=document.getElementById('panicTime');if(timeEl)timeEl.textContent=`⏱️ ${Math.ceil(remaining/1000)}`;
    PANIC.raf=requestAnimationFrame(draw);
  };
  PANIC.raf=requestAnimationFrame(draw);
}
function finishKitchenPanic(){

};

function commonLinkTags(ids){
  if(ids.length!==3||new Set(ids).size!==3)return [];
  if(ids.includes('pan'))return ['joker:pan'];
  const first=LINK_ITEM_BY_ID[ids[0]];if(!first)return [];
  return first.tags.filter(tag=>ids.slice(1).every(id=>LINK_ITEM_BY_ID[id]?.tags.includes(tag)));
}
function findLinkMatches(board){
  const cells=new Map(),tags=new Set();let groups=0;
  const addLine=indices=>{const ids=indices.map(i=>board[i]);if(ids.some(id=>!id))return;const shared=commonLinkTags(ids);if(!shared.length)return;groups++;shared.forEach(x=>tags.add(x));indices.forEach(i=>{if(!cells.has(i))cells.set(i,new Set());shared.forEach(x=>cells.get(i).add(x));});};
  for(let r=0;r<6;r++)for(let c=0;c<6;c++){if(c<=3)addLine([r*6+c,r*6+c+1,r*6+c+2]);if(r<=3)addLine([r*6+c,(r+1)*6+c,(r+2)*6+c]);}
  return {cells,tags:[...tags],groups};
}
function canPlaceLink(board,r,c,id){
  if(!id||id==='pan')return true;
  if(c>=2&&board[r*6+c-1]&&board[r*6+c-2]&&commonLinkTags([board[r*6+c-2],board[r*6+c-1],id]).length)return false;
  if(r>=2&&board[(r-1)*6+c]&&board[(r-2)*6+c]&&commonLinkTags([board[(r-2)*6+c],board[(r-1)*6+c],id]).length)return false;
  return true;
}
function hasLinkMove(board){
  for(let i=0;i<36;i++)for(const j of [i%6<5?i+1:-1,i<30?i+6:-1])if(j>=0&&board[i]&&board[j]){[board[i],board[j]]=[board[j],board[i]];const yes=findLinkMatches(board).groups>0;[board[i],board[j]]=[board[j],board[i]];if(yes)return true;}
  return false;
}
function makeLinkBoard(){
  const ids=LINK_ITEMS.filter(x=>!x.special).map(x=>x.id);
  for(let attempt=0;attempt<500;attempt++){
    const board=Array(36).fill(null);let failed=false;
    for(let r=3;r<6&&!failed;r++)for(let c=0;c<6;c++){const choices=[...ids].sort(()=>Math.random()-.5);const pick=choices.find(id=>canPlaceLink(board,r,c,id));if(!pick){failed=true;break;}board[r*6+c]=pick;}
    if(!failed&&findLinkMatches(board).groups===0&&hasLinkMove(board))return board;
  }
  return Array(18).fill(null).concat(Array.from({length:18},()=>ids[Math.floor(Math.random()*ids.length)]));
}

  LINK_GAME.clockTimer=setInterval(()=>{if(LINK_GAME.mode==='playing'){const el=document.getElementById('linkClock');if(el)el.textContent=Math.max(0,Math.ceil((LINK_GAME.nextDropAt-Date.now())/1000))+'s';}},250);
}
function startFoodRushLink(){
  stopLinkClocks();LINK_GAME.mode='playing';LINK_GAME.board=makeLinkBoard();LINK_GAME.selected=[];LINK_GAME.clearing=[];LINK_GAME.dropping=[];LINK_GAME.invalid=[];LINK_GAME.busy=false;LINK_GAME.score=0;LINK_GAME.waves=0;LINK_GAME.dropMs=15000;LINK_GAME.feedback=linkText('Wissel producten om drie passende items te verbinden. De pan is een joker!','Swap products to connect three matching items. The pan is a wild card!');render();startLinkClocks();
}

  if(LINK_GAME.mode==='over')return `<main><section class="card linkGame">${head}<div class="discover"><div class="bowl">🍳💥</div><h2>${linkText('De stapel is te hoog!','The stack got too high!')}</h2><p>⭐ ${LINK_GAME.score} · ${linkText('golven overleefd: ','waves survived: ')}${LINK_GAME.waves}</p></div><button class="btn primary" id="btnLinkAgain">${linkText('Nog een poging ↻','Try again ↻')}</button><button class="btn ghost" id="btnLinkExit" style="margin-top:10px">${linkText('Terug naar CuliLab','Back to CuliLab')}</button></section></main>`;
  return `<main><section class="card linkGame">${head}<div class="linkStats"><span class="linkStat">🌊 ${linkText('Golf','Wave')} ${LINK_GAME.waves+1}</span><span class="linkStat">⬇️ ${linkText('Nieuwe rij over','Next row in')} <b id="linkClock">${Math.max(0,Math.ceil((LINK_GAME.nextDropAt-Date.now())/1000))}s</b></span><span class="linkStat">⭐ ${LINK_GAME.score}</span></div><div class="linkBoard" id="linkBoard" aria-label="${linkText('Speelbord: wissel twee buurproducten','Game board: swap two neighboring products')}">${LINK_GAME.board.map((id,i)=>{const item=id?LINK_ITEM_BY_ID[id]:null;return `<button class="linkTile ${LINK_GAME.selected.includes(i)?'selected':''} ${LINK_GAME.clearing.includes(i)?'clearing':''} ${LINK_GAME.dropping.includes(i)?'dropping':''} ${LINK_GAME.invalid.includes(i)?'invalid':''} ${item?.special?'special':''}" data-link-tile="${i}" aria-label="${item?tr(item.name):linkText('leeg vak','empty slot')}" ${!item?'disabled':''}>${item?`<span class="produce">${item.icon}</span><span class="produceName">${tr(item.name)}</span>`:''}</button>`}).join('')}</div><div class="feedback ${LINK_GAME.invalid.length?'bad':'good'}" id="linkFeedback">${LINK_GAME.feedback}</div><p class="muted">${linkText('Tik een product aan en wissel met een buurvakje. De stapel groeit bij elke nieuwe rij. Bij geen mogelijke zet wordt het bord automatisch geschud.','Tap a product and swap it with a neighbor. The stack grows with every new row. If no moves are possible, the board reshuffles automatically.')}</p><button class="btn ghost" id="btnLinkExit">${linkText('Stoppen en terug','Stop and go back')}</button></section></main>`;
}
function swapLinkTiles(a,b){
  if(LINK_GAME.busy)return;LINK_GAME.busy=true;LINK_GAME.selected=[];[LINK_GAME.board[a],LINK_GAME.board[b]]=[LINK_GAME.board[b],LINK_GAME.board[a]];const result=findLinkMatches(LINK_GAME.board);
  if(!result.groups){LINK_GAME.invalid=[a,b];LINK_GAME.feedback=linkText('Die wissel maakt nog geen verbinding. Probeer een andere buur.','That swap does not make a connection yet. Try another neighbor.');render();LINK_GAME.actionTimer=setTimeout(()=>{[LINK_GAME.board[a],LINK_GAME.board[b]]=[LINK_GAME.board[b],LINK_GAME.board[a]];LINK_GAME.invalid=[];LINK_GAME.busy=false;LINK_GAME.feedback=linkText('Zoek drie verschillende producten die bij elkaar passen.','Find three different products that fit together.');render();},280);return;}
  clearTimeout(LINK_GAME.dropTimer);LINK_GAME.dropTimer=0;applyLinkMatches(result);
}
function settleLinkColumns(){for(let c=0;c<6;c++){const keep=[];for(let r=5;r>=0;r--){const id=LINK_GAME.board[r*6+c];if(id)keep.push(id);}for(let r=5;r>=0;r--)LINK_GAME.board[r*6+c]=keep[5-r]||null;}}
function applyLinkMatches(result){
  LINK_GAME.score+=result.cells.size*10+Math.max(0,result.tags.length-1)*15;LINK_GAME.clearing=[...result.cells.keys()];LINK_GAME.feedback=linkText('Goede verbinding: ','Good connection: ')+result.tags.map(x=>tr(LINK_LABELS[x])).join(' · ');render();
  LINK_GAME.actionTimer=setTimeout(()=>{LINK_GAME.clearing.forEach(i=>LINK_GAME.board[i]=null);LINK_GAME.clearing=[];settleLinkColumns();LINK_GAME.selected=[];LINK_GAME.invalid=[];LINK_GAME.feedback=linkText('Mooi! De producten zakken naar beneden.','Nice! The products fall down.');render();LINK_GAME.actionTimer=setTimeout(resolveLinkCascades,180);},250);
}
function reshuffleLinkBoard(){
  for(let attempt=0;attempt<150;attempt++){
    const candidate=Array(36).fill(null);let items=LINK_GAME.board.filter(Boolean).sort(()=>Math.random()-.5),k=0;
    for(let c=0;c<6;c++)for(let r=5;r>=0;r--)if(LINK_GAME.board[r*6+c])candidate[r*6+c]=items[k++];
    if(findLinkMatches(candidate).groups===0&&hasLinkMove(candidate)){LINK_GAME.board=candidate;LINK_GAME.feedback=linkText('Geen zet mogelijk — de producten zijn geschud!','No moves available — the products were shuffled!');return;}
  }
  LINK_GAME.board=makeLinkBoard();LINK_GAME.feedback=linkText('Geen zet mogelijk — een nieuw speelbord!','No moves available — a fresh board!');
}
function resolveLinkCascades(){
  if(LINK_GAME.mode!=='playing')return;const result=findLinkMatches(LINK_GAME.board);if(result.groups){applyLinkMatches(result);return;}LINK_GAME.busy=false;LINK_GAME.selected=[];
  if(!hasLinkMove(LINK_GAME.board))reshuffleLinkBoard();render();startLinkClocks();
}
function dropLinkWave(){
  if(LINK_GAME.mode!=='playing')return;LINK_GAME.dropTimer=0;LINK_GAME.busy=true;LINK_GAME.waves++;LINK_GAME.dropMs=Math.max(9000,15000-Math.floor(LINK_GAME.waves/4)*1000);const incoming=Array.from({length:6},()=>drawLinkProduct()),landed=[];
  for(let c=0;c<6;c++){let landing=-1;for(let r=0;r<6;r++)if(LINK_GAME.board[r*6+c]){landing=r-1;break;}if(landing===-1)landing=5;if(landing<0){linkGameOver();return;}LINK_GAME.board[landing*6+c]=incoming[c];landed.push(landing*6+c);}
  LINK_GAME.dropping=landed;LINK_GAME.feedback=linkText('Nieuwe rij valt binnen! Maak ruimte in de stapel.','New row dropping! Make room in the stack.');render();
  LINK_GAME.actionTimer=setTimeout(()=>{LINK_GAME.dropping=[];const matches=findLinkMatches(LINK_GAME.board);if(matches.groups)applyLinkMatches(matches);else{LINK_GAME.busy=false;if(!hasLinkMove(LINK_GAME.board))reshuffleLinkBoard();render();startLinkClocks();}},450);
}
function chooseLinkTile(index){
  if(LINK_GAME.busy||LINK_GAME.mode!=='playing'||!LINK_GAME.board[index])return;
  if(!LINK_GAME.selected.length){LINK_GAME.selected=[index];LINK_GAME.feedback=linkText('Kies nu een vakje ernaast om te wisselen.','Now choose a neighboring tile to swap.');render();return;}
  const first=LINK_GAME.selected[0];if(first===index){LINK_GAME.selected=[];LINK_GAME.feedback=linkText('Selectie gewist. Kies een product.','Selection cleared. Choose a product.');render();return;}
  const adjacent=Math.abs(Math.floor(first/6)-Math.floor(index/6))+Math.abs(first%6-index%6)===1;if(!adjacent){LINK_GAME.selected=[index];LINK_GAME.feedback=linkText('Kies een vakje dat direct naast dit product ligt.','Choose a tile directly next to this product.');render();return;}swapLinkTiles(first,index);
}

function render(){
  const app=document.getElementById('app');
  let html='';
  if(S.phase==='home'){
    html = screenHome();
  } else if(S.phase==='panic'){
    html = screenKitchenPanic();
  } else if(S.phase==='foodrushLink'){
    html = renderFoodRushLink();
  } else if(S.phase==='celebrate'){
    html = screenCelebrate();
  } else if(S.phase==='win'){
    html = header(false) + screenWin();
  } else if(S.phase==='pairing'){
    html = header(true) + screenPairing();
  } else {
    html = header(true);
    if(S.phase==='ingredients') html+=screenIngredients();
    else if(S.phase==='pairing') html+=screenPairing();
    else if(S.phase==='knowledge') html+=screenKnowledge();
    else if(S.phase==='taste') html+=screenTaste();
    else if(S.phase==='spices') html+=screenSpices();
    else if(S.phase==='action') html+=screenAction();
    else if(S.phase==='do') html+=screenDo();
    else if(S.phase==='discover') html+=screenDiscover();
    else if(S.phase==='book') html+=screenBook();
    else if(S.phase==='badges') html+=screenBadges();
  }
  app.innerHTML=html;
  wire();
  if(S.phase==='do') bindDoMechanic();
  if(S.phase==='panic'&&PANIC.mode==='run') bindKitchenPanic();
  if(S.phase==='foodrushLink'&&LINK_GAME.mode==='playing') bindFoodRushLink();
}

function wire(){
  const q=(s)=>document.querySelectorAll(s);
  const on=(s,fn)=>{ const n=document.getElementById(s); if(n) n.onclick=fn; };

  on('btnStart', ()=>{ S.lessonOpen=false; S.phase='ingredients'; if(!S.pick) S.pick=[]; S.msg=t('chooseIngredients'); render(); });
  on('btnKitchenPanic', ()=>{PANIC.mode='ready';PANIC.best=panicBest();S.phase='panic';render();});
  on('btnFoodRushLink', ()=>{LINK_GAME.mode='ready';LINK_GAME.unlocked=readLinkUnlock();S.phase='foodrushLink';render();});
  on('btnLinkExit', exitFoodRushLink);
  on('btnLinkStart', startFoodRushLink);
  on('btnLinkAgain', startFoodRushLink);
  on('btnPanicStart', startKitchenPanic);
  on('btnPanicAgain', startKitchenPanic);
  on('btnPanicExit', exitKitchenPanic);
  on('btnPairStart', ()=>{ S.phase='pairing'; S.pairingIndex=0; S.pairingAnswered=false; S.pairingFeedback=''; S.msg=''; S.msgType=''; render(); });
  on('btnPairLearn', revealPairing);
  on('btnNextPair', nextPairing);
  on('btnPairHome', ()=>{ S.phase='home'; save(); render(); });
  q('[data-pair]').forEach(b=>b.onclick=()=>answerPairing(b.dataset.pair));
  q('[data-ktopic]').forEach(b=>b.onclick=()=>chooseKnowledgeTopic(b.dataset.ktopic));
  q('[data-mise]').forEach(b=>b.onchange=()=>toggleMiseStep(Number(b.dataset.mise)));
  q('[data-kanswer]').forEach(b=>b.onclick=()=>chooseKnowledgeAnswer(b.dataset.kanswer));
  q('[data-taste-mode]').forEach(b=>b.onclick=()=>setTasteMode(b.dataset.tasteMode));
  q('[data-taste-answer]').forEach(b=>b.onclick=()=>S.tasteMode==='balance'?answerTasteBalance(b.dataset.tasteAnswer):toggleTasteAnswer(b.dataset.tasteAnswer));
  on('btnCheckTaste',checkTasteProfile);
  on('btnNextTaste',nextTasteQuestion);
  const sample=document.getElementById('tasteSample');if(sample)sample.onchange=()=>setTasteSample(sample.value);
  q('[data-rating]').forEach(i=>i.oninput=()=>updateTasteRating(i));
  on('btnNextKnowledge', nextKnowledgeQuiz);
  on('btnLearn', ()=>{ if(S.learning){S.learning=false;S.lessonOpen=false;S.phase='home';} else {S.learning=true;S.lessonOpen=true;S.phase='ingredients';S.pick=[];S.msg=t('chooseIngredients');} save(); render(); });
  on('btnLesson', ()=>{ S.lessonOpen=!S.lessonOpen; render(); });
  on('btnReset', resetGame);
  on('btnResetHeader', resetGame);
  on('btnReset2', resetGame);
  on('btnToBook', ()=>{ S.phase='book'; render(); });
  on('btnMute', toggleMute);

  q('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

  q('[data-nav]').forEach(b=>b.onclick=()=>{
    const destination=b.dataset.nav;
    S.phase=destination;
    if(destination==='ingredients'){
      S.pick=[]; S.current=null; S.msg=t('chooseIngredients'); S.msgType='';
    } else if(destination==='pairing') {
      S.pick=[]; S.current=null; S.msg=''; S.msgType='';
      S.pairingAnswered=!!S.pairingAnswered;
    }
    save(); render();
  });

  q('[data-pick]').forEach(b=>b.onclick=()=>selectIngredient(b.dataset.pick));
  q('[data-remove]').forEach(b=>b.onclick=()=>removePick(Number(b.dataset.remove)));
  on('btnPrepare', prepare);
  on('btnTip', useTip);

  q('[data-action]').forEach(b=>b.onclick=()=>chooseAction(b.dataset.action));
  q('[data-spice]').forEach(b=>b.onclick=()=>toggleSpice(b.dataset.spice));
  on('btnCheckSpices',submitSpices);
  

  on('btnContinue', afterDiscover);
  on('btnCelebrateContinue', ()=>{ S.pendingUnlock=null; S.phase='ingredients'; S.pick=[]; S.current=null; S.msg=t('newIngredientAvailable'); S.msgType=''; save(); render(); });
}

/* ==========================================================
   6) INIT
   ========================================================== */
if(hasSave()) load();
document.documentElement.lang=S.lang||'nl';
render();

</script>
</body>
</html>
